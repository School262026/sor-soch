<!doctype html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мұғалім құралдары</title>
<meta name="description" content="Тегін мұғалім құралдары: сабақ таймері, рефлексия, интерактивті сабақ, БЖБ/ТЖБ (СОР/СОЧ) кестесі. Қазақша, орысша, ағылшынша.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✏️%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .hero { text-align: center; padding: 28px 0 8px; }
  .hero h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 8px; font-weight: 900; }
  .hero p { margin: 0 auto; max-width: 640px; color: var(--muted); font-size: 18px; }
  .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 16px 0 28px; }
  .badge { background: var(--green-soft); color: var(--green); font-weight: 800; padding: 5px 12px; border-radius: 999px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .tool { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--text); transition: transform .15s, box-shadow .15s; }
  .tool:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(28,36,52,.14); }
  .tool .ic { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; }
  .tool h3 { margin: 4px 0 0; font-size: 20px; }
  .tool p { margin: 0; color: var(--muted); font-size: 15px; }
  .tool .new { align-self: flex-start; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
    <div class="badges">
      <span class="badge" data-i="b1"></span><span class="badge" data-i="b2"></span><span class="badge" data-i="b3"></span>
    </div>
  </section>
  <section class="grid">
    <a class="card tool" href="timer.html"><span class="ic" style="background:var(--primary-soft)">⏱️</span><h3 data-i="t1"></h3><p data-i="d1"></p></a>
    <a class="card tool" href="minute.html"><span class="ic" style="background:var(--amber-soft)">⏳</span><h3 data-i="t2"></h3><p data-i="d2"></p></a>
    <a class="card tool" href="reflection.html"><span class="ic" style="background:var(--green-soft)">🙋</span><h3 data-i="t3"></h3><p data-i="d3"></p></a>
    <a class="card tool" href="lesson.html"><span class="ic" style="background:var(--green-soft)">🌿</span><h3 data-i="t4"></h3><p data-i="d4"></p></a>
    <a class="card tool" href="sor-soch.html"><span class="new">NEW</span><span class="ic" style="background:var(--violet-soft)">📅</span><h3 data-i="t5"></h3><p data-i="d5"></p></a>
    <a class="card tool" href="tests.html"><span class="ic" style="background:var(--red-soft)">📋</span><h3 data-i="t6"></h3><p data-i="d6"></p></a>
  </section>
</main>
<script src="common.js"></script>
