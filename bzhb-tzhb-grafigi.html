  { from: '2027-05-03', kk: 'Қазақстан халқының бірлігі мерекесі (01.05 → ауыстырылған)', ru: 'Праздник единства народа Казахстана (перенос с 01.05)' },
  { from: '2027-05-07', kk: 'Отан қорғаушы күні', ru: 'День защитника Отечества' },
  { from: '2027-05-10', kk: 'Жеңіс күні (09.05 → ауыстырылған)', ru: 'День Победы (перенос с 09.05)' },
  { from: '2027-05-16', kk: 'Құрбан айт (күнін тексеріңіз)', ru: 'Курбан айт (уточните дату)', off: true }
];
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const fmtD = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '—';
const defHol = () => HOLIDAYS.map(h => ({ from: h.from, to: h.to || '', kk: h.kk, ru: h.ru, on: !h.off })).concat([Object.assign({}, FIRST_BREAK, { on: false })]);

// КТП генераторында қойылған кесте болса — содан бастаймыз
const ktp = App.store.get('mt-ktp');
const blank = () => ({ level: App.prim ? 'prim' : 'sec', subject: '', cls: '', teacher: '',
  pers: ktp && ktp.pers ? ktp.pers : PRESET.map(p => p.slice()), week: ktp ? ktp.week : 5, hours: ktp ? ktp.hours.slice() : [0, 1, 0, 1, 0, 0, 0],
  hols: ktp && ktp.hols ? ktp.hols : defHol(), first: false, cnt: [2, 2, 3, 2], soch: true, works: null });
let S = App.store.get('mt-sg') || blank();
if (App.prim && S.level !== 'prim') S.level = 'prim';
const save = () => App.store.set('mt-sg', S);
const holName = h => h[App.lang] || h.kk || '';
const perWeek = () => [1, 2, 3, 4, 5, 6].reduce((a, d) => a + (d === 6 && S.week !== 6 ? 0 : (+S.hours[d] || 0)), 0);
const oneHour = () => S.level === 'sec' && perWeek() === 1;

// сабақ күндері тоқсан бойынша (бір күнде бірнеше сағат болса — бір күн ретінде)
function lessonDays() {
  const off = {};
  S.hols.forEach(h => { if (!h.on || !h.from) return; for (let d = parse(h.from); d <= parse(h.to || h.from); d.setDate(d.getDate() + 1)) off[iso(d)] = 1; });
  return S.pers.map(p => {
    const out = []; if (!p[0] || !p[1]) return out;
    for (let d = parse(p[0]); d <= parse(p[1]); d.setDate(d.getDate() + 1)) {
      const wd = d.getDay();
      if (wd === 0 || (wd === 6 && S.week !== 6) || !(+S.hours[wd]) || off[iso(d)]) continue;
      out.push(iso(d));
    }
    return out;
  });
}
// жұмыстарды біркелкі бөлу: ТЖБ — соңғы сабақтың алдында, БЖБ/АБ — бөлімдер соңында
function distribute() {
  const days = lessonDays();
  const old = S.works || [];
  S.works = days.map((ld, qi) => {
    const prev = old[qi] || [];
    const unitOf = (type, n) => { const w = prev.find(x => x.type === type && x.n === n); return w ? w.unit : ''; };
    const L = ld.length, list = [];
    if (!L) return list; // сабақ күні жоқ — жұмыс та жоқ
    if (S.level === 'prim') {
      const k = Math.max(1, Math.min(6, +S.cnt[qi] || 1));
      for (let i = 0; i < k; i++) list.push({ type: 'ao', n: i + 1, d: ld[Math.max(0, Math.round((i + 1) * L / k) - 1)] || '', unit: unitOf('ao', i + 1) });
    } else {
      const one = oneHour(), k = one ? 1 : Math.max(1, Math.min(6, +S.cnt[qi] || 1)), soch = !one && S.soch;
      const sochIdx = soch ? (L >= 4 ? L - 2 : L - 1) : L;
      const span = soch ? Math.max(1, sochIdx) : L;
      for (let i = 0; i < k; i++) {
        let idx = Math.max(0, Math.round((i + 1) * span / (k + (soch ? 0.5 : 0))) - 1);
        if (soch && idx >= sochIdx) idx = sochIdx - 1;
        list.push({ type: 'sor', n: i + 1, d: ld[Math.max(0, idx)] || '', unit: unitOf('sor', i + 1) });
      }
      if (soch) list.push({ type: 'soch', n: 1, d: ld[Math.max(0, sochIdx)] || '', unit: unitOf('soch', 1) });
    }
    // бір күнге екі жұмыс түспесін
    for (let i = 1; i < list.length; i++) if (list[i].d && list[i].d === list[i - 1].d) { const j = ld.indexOf(list[i].d); if (ld[j + 1]) list[i].d = ld[j + 1]; }
    return list;
  });
  save();
}

// ---- енгізу
function renderTop() {
  document.querySelectorAll('#level button').forEach(b => { b.classList.toggle('on', b.dataset.l === S.level); b.classList.toggle('hide', App.prim && b.dataset.l === 'sec'); });
  ['subject', 'cls', 'teacher'].forEach(k => { if (document.activeElement !== $(k)) $(k).value = S[k] || ''; });
  $('subjList').innerHTML = SUBJ[App.lang].map(s => '<option value="' + esc(s) + '">').join('');
}
$('level').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; S.level = b.dataset.l; distribute(); all(); };
['subject', 'cls', 'teacher'].forEach(k => $(k).oninput = () => { S[k] = $(k).value; save(); renderOut(); });

function renderDays() {
  document.querySelectorAll('#week button').forEach(b => b.classList.toggle('on', +b.dataset.w === S.week));
  const L = WD[App.lang];
  $('days').innerHTML = [1, 2, 3, 4, 5, 6].map(d => '<div class="day' + (d === 6 && S.week !== 6 ? ' off' : '') + '"><b>' + L[d] + '</b><span class="step"><button data-dm="' + d + '">−</button><span>' + (+S.hours[d] || 0) + '</span><button data-dp="' + d + '">+</button></span></div>').join('');
  $('weekly').innerHTML = t('perWeek') + '<b>' + perWeek() + '</b>' + (oneHour() ? ' — ' + t('oneHour') : '');
}
$('week').onclick = e => { const b = e.target.closest('[data-w]'); if (!b) return; S.week = +b.dataset.w; distribute(); all(); };
$('days').onclick = e => {
  const m = e.target.closest('[data-dm]'), p = e.target.closest('[data-dp]'); if (!m && !p) return;
  const d = +(m || p).dataset[m ? 'dm' : 'dp']; if (d === 6 && S.week !== 6) return;
  S.hours[d] = Math.max(0, Math.min(6, (+S.hours[d] || 0) + (m ? -1 : 1))); distribute(); all();
};

function renderCnt() {
  const one = oneHour(), nm = S.level === 'prim' ? SHORT.ao[App.lang] : SHORT.sor[App.lang];
  $('cnts').innerHTML = S.pers.map((p, i) => '<div class="cnt"><b>' + (i + 1) + ' ' + t('qWord') + '</b><span>' + nm + (S.level === 'sec' && !one && S.soch ? ' + ' + SHORT.soch[App.lang] : '') + '</span>' +
    '<span class="step"><button data-cm="' + i + '"' + (one ? ' disabled' : '') + '>−</button><span>' + (one ? 1 : (+S.cnt[i] || 1)) + '</span><button data-cp="' + i + '"' + (one ? ' disabled' : '') + '>+</button></span></div>').join('');
  $('sochRow').classList.toggle('hide', S.level !== 'sec' || one);
  $('soch').checked = !!S.soch;
  $('rule').innerHTML = S.level === 'prim' ? t('rulePrim') : t('ruleSec');
}
$('cnts').onclick = e => {
  const m = e.target.closest('[data-cm]'), p = e.target.closest('[data-cp]'); if (!m && !p) return;
  const i = +(m || p).dataset[m ? 'cm' : 'cp'];
  S.cnt[i] = Math.max(1, Math.min(6, (+S.cnt[i] || 1) + (m ? -1 : 1))); distribute(); all();
};
$('soch').onchange = () => { S.soch = $('soch').checked; distribute(); all(); };

function renderPers() {
  $('pers').innerHTML = S.pers.map((p, i) => '<div class="per"><b>' + (i + 1) + '</b><input type="date" data-pe="' + i + ':0" value="' + (p[0] || '') + '"><input type="date" data-pe="' + i + ':1" value="' + (p[1] || '') + '"><button class="btn sm" data-rmpe="' + i + '">✕</button></div>').join('');
  $('first').checked = !!S.first;
}
$('pers').onchange = e => { const k = e.target.dataset.pe; if (!k) return; const [i, j] = k.split(':'); S.pers[i][j] = e.target.value; distribute(); all(); };
$('pers').onclick = e => { const b = e.target.closest('[data-rmpe]'); if (!b) return; S.pers.splice(+b.dataset.rmpe, 1); S.cnt.splice(+b.dataset.rmpe, 1); distribute(); all(); };
$('addPer').onclick = () => { if (S.pers.length < 6) { S.pers.push(['', '']); S.cnt.push(2); } save(); renderPers(); renderCnt(); };
$('preset').onclick = () => { const old = JSON.stringify(S); S.pers = PRESET.map(p => p.slice()); S.cnt = [2, 2, 3, 2]; S.hols = defHol().concat(S.hols.filter(h => h.custom)); applyFirst(); distribute(); all(); App.toast(t('preset') + ' ✓', () => { S = JSON.parse(old); save(); all(); }); };
function applyFirst() { S.hols.forEach(h => { if (h.first) h.on = !!S.first; }); }
$('first').onchange = () => { S.first = $('first').checked; applyFirst(); distribute(); all(); };

function renderHols() {
  const sorted = S.hols.map((h, i) => ({ h, i })).sort((a, b) => a.h.from.localeCompare(b.h.from));
  $('hols').innerHTML = sorted.map(({ h, i }) => '<label class="hol"><input type="checkbox" data-ho="' + i + '"' + (h.on ? ' checked' : '') + '><span>' + fmtD(h.from) + (h.to && h.to !== h.from ? '<br>– ' + fmtD(h.to) : '') + '</span><span>' + esc(holName(h)) + '</span>' + (h.custom ? '<button class="btn sm" data-rmho="' + i + '">✕</button>' : '<span></span>') + '</label>').join('');
}
$('hols').onchange = e => { const i = e.target.dataset.ho; if (i == null) return; S.hols[i].on = e.target.checked; distribute(); all(); };
$('hols').onclick = e => { const b = e.target.closest('[data-rmho]'); if (!b) return; e.preventDefault(); S.hols.splice(+b.dataset.rmho, 1); distribute(); all(); };
$('addHol').onclick = () => {
  const f = $('hFrom').value; if (!f) { $('hFrom').focus(); return; }
  const to = $('hTo').value && $('hTo').value >= f ? $('hTo').value : '';
  const nm = $('hName').value.trim() || (App.lang === 'ru' ? 'Выходной' : 'Демалыс');
  S.hols.push({ from: f, to, kk: nm, ru: nm, on: true, custom: true });
  $('hFrom').value = ''; $('hTo').value = ''; $('hName').value = '';
  distribute(); all();
};

// ---- нәтиже
const title = () => t('pageTitle') + (S.subject ? ' · ' + S.subject : '') + (S.cls ? ' · ' + S.cls : '');
const wName = w => SHORT[w.type][App.lang] + (w.type === 'soch' ? '' : ' №' + w.n);
function renderOut() {
  $('outTitle').textContent = title();
  const days = lessonDays(), L = WDs[App.lang];
  const warns = [];
  if (!perWeek()) warns.push(t('noHours'));
  let h = '<table class="out"><thead><tr><th>' + t('num') + '</th><th>' + t('type') + '</th><th>' + t('unit') + '</th><th>' + t('date') + '</th></tr></thead><tbody>';
  let n = 0;
  const counts = { sor: 0, soch: 0, ao: 0 };
  if (!perWeek()) { $('out').innerHTML = '<p class="muted" style="padding:12px">' + t('noHours') + '</p>'; $('sum').innerHTML = ''; $('warns').innerHTML = ''; renderChips(); return; }
  (S.works || []).forEach((list, qi) => {
    if (!list.length) return;
    if (days[qi].length < list.length) warns.push((qi + 1) + ' ' + t('tooMany'));
    h += '<tr class="ph"><td colspan="4">' + (qi + 1) + ' ' + t('qWord') + ' · ' + days[qi].length + ' ' + t('lessons') + '</td></tr>';
    list.forEach((w, wi) => {
      n++; counts[w.type]++;
      if (list.some((x, xi) => xi !== wi && x.d && x.d === w.d) && wi > list.findIndex(x => x.d === w.d)) warns.push(t('sameDay') + fmtD(w.d));
      const so = list.find(x => x.type === 'soch');
      if (w.type === 'sor' && so && w.d && so.d && w.d > so.d) warns.push((qi + 1) + ' ' + t('qWord') + ': ' + t('afterSoch'));
      h += '<tr><td>' + n + '</td><td><span class="tag t-' + w.type + '">' + esc(wName(w)) + '</span></td>' +
        '<td><input type="text" data-u="' + qi + ':' + wi + '" value="' + esc(w.unit || '') + '" placeholder="' + esc(t('unitPh')) + '"></td>' +
        '<td><select data-d="' + qi + ':' + wi + '">' + days[qi].map(d => { const dis = d !== w.d && blocked(list, w, d);
          return '<option value="' + d + '"' + (d === w.d ? ' selected' : '') + (dis ? ' disabled' : '') + '>' + fmtD(d) + ' · ' + L[parse(d).getDay()] + '</option>'; }).join('') + '</select></td></tr>';
    });
  });
  $('out').innerHTML = h + '</tbody></table>';
  $('sum').innerHTML = (S.level === 'prim' ? '<div class="kpi">' + SHORT.ao[App.lang] + '<b>' + counts.ao + '</b></div>' : '<div class="kpi">' + SHORT.sor[App.lang] + '<b>' + counts.sor + '</b></div><div class="kpi">' + SHORT.soch[App.lang] + '<b>' + counts.soch + '</b></div>') +
    '<div class="kpi">' + t('total') + '<b>' + n + '</b></div>';
  $('warns').innerHTML = [...new Set(warns)].map(x => '<div class="warn">⚠️ ' + esc(x) + '</div>').join('');
  renderChips();
}
// күн бос емес пе, ретке сай ма: БЖБ/АБ — ТЖБ-дан бұрын, ТЖБ — соңғы БЖБ-дан кейін
function blocked(list, w, d) {
  if (list.some(x => x !== w && x.d === d)) return true;
  const so = list.find(x => x.type === 'soch');
  if (w.type === 'sor' && so && so.d && d >= so.d) return true;
  if (w.type === 'soch') { const last = list.filter(x => x.type === 'sor' && x.d).map(x => x.d).sort().pop(); if (last && d <= last) return true; }
  return false;
}
// күн ауысқан соң: жұмыстар күн ретімен сұрыпталып, қайта нөмірленеді (бөлім атауы жұмыспен бірге жүреді)
function reorder(qi) {
  const list = S.works[qi];
  ['sor', 'ao'].forEach(ty => { list.filter(x => x.type === ty).sort((a, b) => (a.d || '9').localeCompare(b.d || '9')).forEach((x, i) => { x.n = i + 1; }); });
  list.sort((a, b) => (a.type === 'soch') - (b.type === 'soch') || a.n - b.n);
}
$('out').onchange = e => { const k = e.target.dataset.d; if (!k) return; const [q, i] = k.split(':'); S.works[q][i].d = e.target.value; reorder(+q); save(); renderOut(); };
$('out').oninput = e => { const k = e.target.dataset.u; if (!k) return; const [q, i] = k.split(':'); S.works[q][i].unit = e.target.value; save(); };
// толық тазалау: пән, сынып, мұғалім, сабақ кестесі, жұмыс саны және күндер (тоқсандар мен мерекелер қалады)
$('clearAll').onclick = () => {
  const old = JSON.stringify(S);
  Object.assign(S, { subject: '', cls: '', teacher: '', hours: [0, 0, 0, 0, 0, 0, 0], cnt: S.pers.map(() => 1), soch: true, works: null });
  distribute(); all(); scrollTo({ top: 0, behavior: 'smooth' });
  App.toast(t('clearedAll'), () => { S = JSON.parse(old); save(); all(); });
};
$('regen').onclick = () => { const old = JSON.stringify(S); S.works = null; distribute(); renderOut(); App.toast(t('cleared'), () => { S = JSON.parse(old); save(); renderOut(); }); };

// ---- экспорт
const head = () => [t('num'), (App.lang === 'ru' ? 'Четверть' : 'Тоқсан'), t('type'), t('unit'), t('date'), t('wd')];
function rowsData() {
  const out = []; let n = 0;
  (S.works || []).forEach((list, qi) => list.forEach(w => { n++; out.push([n, qi + 1, wName(w), w.unit || '', fmtD(w.d), w.d ? WD[App.lang][parse(w.d).getDay()] : '']); }));
  return out;
}
function copyText(txt, msg) {
  const done = () => App.toast(msg || t('copied'));
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fb); else fb();
  function fb() { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }
}
function download(name, data, mime) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
const fileBase = () => ((App.lang === 'ru' ? 'График_СОР_СОЧ' : 'БЖБ_ТЖБ_графигі') + (S.subject ? '_' + S.subject : '') + (S.cls ? '_' + S.cls : '')).replace(/[\\/:*?"<>|\s]+/g, '_');
function renderChips() {
  const L = WDs[App.lang];
  $('chips').innerHTML = (S.works || []).map((list, qi) => !list.length ? '' : '<div class="qq">' + (qi + 1) + ' ' + t('qWord') + '</div><div class="chips">' +
    list.filter(w => w.d).map(w => '<button class="chip c-' + w.type + '" data-cd="' + fmtD(w.d) + '" data-cn="' + esc(wName(w)) + '"><small>' + esc(wName(w)) + (w.unit ? ' · ' + esc(w.unit.slice(0, 18)) : '') + '</small><b>' + fmtD(w.d) + '</b><span class="muted" style="font-size:12px">' + (WD[App.lang][parse(w.d).getDay()]) + '</span><span class="ic">⧉</span></button>').join('') + '</div>').join('');
}
$('chips').onclick = e => {
  const c = e.target.closest('[data-cd]'); if (!c) return;
  copyText(c.dataset.cd, t('cpOne') + c.dataset.cn + ' — ' + c.dataset.cd);
  c.classList.add('ok'); c.querySelector('.ic').textContent = '✓';
  setTimeout(() => { c.classList.remove('ok'); c.querySelector('.ic').textContent = '⧉'; }, 1500);
};
const allWorks = () => [].concat.apply([], (S.works || []).map(l => l.filter(w => w.d)));
$('cpDates').onclick = () => copyText(allWorks().map(w => fmtD(w.d)).join(String.fromCharCode(10)), t('cpAll'));
$('cpTyped').onclick = () => copyText(allWorks().map(w => wName(w) + (w.unit ? ' (' + w.unit + ')' : '') + ' — ' + fmtD(w.d)).join(String.fromCharCode(10)), t('cpAll'));
$('copyT').onclick = () => copyText([head()].concat(rowsData()).map(r => r.join('\t')).join('\n'));
$('csv').onclick = () => { const q = v => '"' + String(v).replace(/"/g, '""') + '"'; download(fileBase() + '.csv', '﻿' + [[title()], []].concat([head()], rowsData()).map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8'); };
$('word').onclick = () => {
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:"Times New Roman";font-size:12pt} table{border-collapse:collapse;width:100%} td,th{border:1px solid #000;padding:3pt 5pt;text-align:left} th{background:#eee}</style></head><body>' +
    '<h3 style="text-align:center">' + esc(title()) + '</h3>' + (S.teacher ? '<p>' + esc(t('teacher')) + ': ' + esc(S.teacher) + '</p>' : '') +
    '<table><tr>' + head().map(x => '<th>' + esc(x) + '</th>').join('') + '</tr>' + rowsData().map(r => '<tr>' + r.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>').join('') + '</table></body></html>';
  download(fileBase() + '.doc', '﻿' + html, 'application/msword');
};
$('print').onclick = () => print();

function all() { renderTop(); renderDays(); renderCnt(); renderPers(); renderHols(); renderOut(); }
App.onLang.push(all);
if (!S.works) distribute();
all();
</script>
