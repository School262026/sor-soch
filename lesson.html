<!doctype html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фотосинтез</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  body { background: #e6f4ea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #10201a; } }
  .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .dots button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .dots button.on { background: var(--green); color: #fff; border-color: var(--green); }
  .slide { min-height: 420px; animation: in .35s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  .slide h2 { font-size: clamp(26px, 4vw, 38px); margin: 0 0 14px; font-weight: 900; color: var(--green); }
  .slide p, .slide li { font-size: 19px; }
  .center { text-align: center; }
  .huge { font-size: 90px; line-height: 1; }
  .eq { font-size: clamp(18px, 3vw, 28px); font-weight: 900; background: var(--green-soft); border-radius: 16px; padding: 18px; text-align: center; margin: 16px 0; }
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; }
  @media (max-width: 700px) { .flow { grid-template-columns: 1fr; } .flow .arr { transform: rotate(90deg); } }
  .flow .box { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .flow .box b { display: block; font-size: 18px; margin-bottom: 6px; }
  .flow .arr { font-size: 36px; color: var(--green); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .fact { background: var(--bg); border-radius: 14px; padding: 14px; border: 1px solid var(--line); }
  .fact .e { font-size: 34px; }
  .q { margin: 18px 0; }
  .q .qt { font-weight: 800; font-size: 20px; margin-bottom: 8px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-size: 17px; font-weight: 600; }
  .opt:hover { border-color: var(--green); }
  .opt.ok { background: var(--green-soft); border-color: var(--green); }
  .opt.bad { background: var(--red-soft); border-color: var(--red); }
  .score { font-size: 24px; font-weight: 900; text-align: center; margin-top: 16px; }
  .game { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game .col { display: grid; gap: 8px; }
  .cell { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px; font-size: 18px; font-weight: 700; cursor: pointer; }
  .cell.sel { border-color: var(--primary); background: var(--primary-soft); }
  .cell.ok { border-color: var(--green); background: var(--green-soft); cursor: default; opacity: .7; }
  .cell.bad { animation: shake .3s; border-color: var(--red); }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .navb { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .navb .btn { font-size: 18px; padding: 12px 22px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="dots no-print" id="dots"></div>
  <section class="card slide" id="slide"></section>
  <div class="navb no-print">
    <button class="btn" id="prev" data-i="prev"></button>
    <b id="ctr" class="muted"></b>
    <button class="btn green" id="next" data-i="next"></button>
  </div>
</main>
<script src="common.js"></script>
<script>
App.init({
  pageTitle: { kk: 'Фотосинтез · 5 сынып', ru: 'Фотосинтез · 5 класс', en: 'Photosynthesis · Grade 5' },
  prev: { kk: '← Артқа', ru: '← Назад', en: '← Back' },
  next: { kk: 'Алға →', ru: 'Вперёд →', en: 'Next →' },
  check: { kk: 'Тексеру', ru: 'Проверить', en: 'Check' },
  again: { kk: 'Қайтадан', ru: 'Заново', en: 'Try again' },
  result: { kk: 'Нәтиже', ru: 'Результат', en: 'Score' },
  win: { kk: '🎉 Жарайсың! Барлығы сәйкестендірілді!', ru: '🎉 Молодец! Все пары найдены!', en: '🎉 Well done! All pairs matched!' },
  gameHint: { kk: 'Сол жақтағы ұғымды, сосын оң жақтағы мағынасын басыңыз.', ru: 'Нажмите понятие слева, затем его значение справа.', en: 'Tap a term on the left, then its meaning on the right.' }
});
const L = o => App.tx(o);
const SLIDES = [
  { id: 'intro', t: { kk: 'Кіріспе', ru: 'Введение', en: 'Intro' } },
  { id: 'def', t: { kk: 'Анықтама', ru: 'Определение', en: 'Definition' } },
  { id: 'proc', t: { kk: 'Процесс', ru: 'Процесс', en: 'Process' } },
  { id: 'quiz', t: { kk: 'Викторина', ru: 'Викторина', en: 'Quiz' } },
  { id: 'test', t: { kk: 'Тест', ru: 'Тест', en: 'Test' } },
  { id: 'game', t: { kk: 'Ойын', ru: 'Игра', en: 'Game' } },
  { id: 'sum', t: { kk: 'Қорытынды', ru: 'Итог', en: 'Summary' } }
];
const QUIZ = [
  { q: { kk: 'Фотосинтез қай органоидта жүреді?', ru: 'В каком органоиде идёт фотосинтез?', en: 'In which organelle does photosynthesis happen?' },
    o: [{ kk: 'Митохондрия', ru: 'Митохондрия', en: 'Mitochondrion' }, { kk: 'Хлоропласт', ru: 'Хлоропласт', en: 'Chloroplast' }, { kk: 'Рибосома', ru: 'Рибосома', en: 'Ribosome' }, { kk: 'Ядро', ru: 'Ядро', en: 'Nucleus' }], c: 1 },
  { q: { kk: 'Фотосинтез үшін қандай газ қажет?', ru: 'Какой газ нужен для фотосинтеза?', en: 'Which gas is needed for photosynthesis?' },
    o: [{ kk: 'Оттегі', ru: 'Кислород', en: 'Oxygen' }, { kk: 'Азот', ru: 'Азот', en: 'Nitrogen' }, { kk: 'Көмірқышқыл газ', ru: 'Углекислый газ', en: 'Carbon dioxide' }, { kk: 'Сутегі', ru: 'Водород', en: 'Hydrogen' }], c: 2 },
  { q: { kk: 'Фотосинтез нәтижесінде қандай газ бөлінеді?', ru: 'Какой газ выделяется при фотосинтезе?', en: 'Which gas is released by photosynthesis?' },
    o: [{ kk: 'Көмірқышқыл газ', ru: 'Углекислый газ', en: 'Carbon dioxide' }, { kk: 'Оттегі', ru: 'Кислород', en: 'Oxygen' }, { kk: 'Азот', ru: 'Азот', en: 'Nitrogen' }, { kk: 'Гелий', ru: 'Гелий', en: 'Helium' }], c: 1 }
];
const TEST = [
  { q: { kk: 'Хлорофилл қандай түсті?', ru: 'Какого цвета хлорофилл?', en: 'What colour is chlorophyll?' },
    o: [{ kk: 'Қызыл', ru: 'Красный', en: 'Red' }, { kk: 'Жасыл', ru: 'Зелёный', en: 'Green' }, { kk: 'Көк', ru: 'Синий', en: 'Blue' }, { kk: 'Сары', ru: 'Жёлтый', en: 'Yellow' }], c: 1 },
  { q: { kk: 'Фотосинтез қай уақытта жүреді?', ru: 'Когда идёт фотосинтез?', en: 'When does photosynthesis take place?' },
    o: [{ kk: 'Тек түнде', ru: 'Только ночью', en: 'Only at night' }, { kk: 'Жарықта (күндіз)', ru: 'На свету (днём)', en: 'In the light (daytime)' }, { kk: 'Ешқашан', ru: 'Никогда', en: 'Never' }, { kk: 'Тек қыста', ru: 'Только зимой', en: 'Only in winter' }], c: 1 },
  { q: { kk: 'Өсімдіктер қандай энергияны пайдаланады?', ru: 'Какую энергию используют растения?', en: 'What energy do plants use?' },
    o: [{ kk: 'Жылу', ru: 'Тепловую', en: 'Heat' }, { kk: 'Жарық', ru: 'Световую', en: 'Light' }, { kk: 'Электр', ru: 'Электрическую', en: 'Electric' }, { kk: 'Дыбыс', ru: 'Звуковую', en: 'Sound' }], c: 1 },
  { q: { kk: 'Фотосинтез нәтижесінде не түзіледі?', ru: 'Что образуется при фотосинтезе?', en: 'What is produced by photosynthesis?' },
    o: [{ kk: 'Ақуыз', ru: 'Белок', en: 'Protein' }, { kk: 'Глюкоза', ru: 'Глюкоза', en: 'Glucose' }, { kk: 'Май', ru: 'Жир', en: 'Fat' }, { kk: 'Тұз', ru: 'Соль', en: 'Salt' }], c: 1 },
  { q: { kk: 'Хлорофилл көбінесе қай мүшеде болады?', ru: 'В каком органе больше всего хлорофилла?', en: 'Which organ contains the most chlorophyll?' },
    o: [{ kk: 'Тамыр', ru: 'Корень', en: 'Root' }, { kk: 'Сабақ', ru: 'Стебель', en: 'Stem' }, { kk: 'Жапырақ', ru: 'Лист', en: 'Leaf' }, { kk: 'Гүл', ru: 'Цветок', en: 'Flower' }], c: 2 }
];
const PAIRS = [
  [{ kk: '☀️ Күн', ru: '☀️ Солнце', en: '☀️ Sun' }, { kk: 'Жарық көзі', ru: 'Источник света', en: 'Source of light' }],
  [{ kk: '💧 Су', ru: '💧 Вода', en: '💧 Water' }, { kk: 'H₂O', ru: 'H₂O', en: 'H₂O' }],
  [{ kk: '🌿 Хлорофилл', ru: '🌿 Хлорофилл', en: '🌿 Chlorophyll' }, { kk: 'Жасыл пигмент', ru: 'Зелёный пигмент', en: 'Green pigment' }],
  [{ kk: '💨 CO₂', ru: '💨 CO₂', en: '💨 CO₂' }, { kk: 'Көмірқышқыл газ', ru: 'Углекислый газ', en: 'Carbon dioxide' }],
  [{ kk: '🫧 O₂', ru: '🫧 O₂', en: '🫧 O₂' }, { kk: 'Оттегі', ru: 'Кислород', en: 'Oxygen' }],
  [{ kk: '🍬 Глюкоза', ru: '🍬 Глюкоза', en: '🍬 Glucose' }, { kk: 'Қант (қоректік зат)', ru: 'Сахар (питательное вещество)', en: 'Sugar (food)' }]
];
let cur = 0, quizA = {}, testA = {}, testChecked = false, game = null;
const $ = id => document.getElementById(id);

function qBlock(list, ans, name, reveal) {
  return list.map((it, i) => '<div class="q"><div class="qt">' + (i + 1) + '. ' + L(it.q) + '</div><div class="opts">' +
    it.o.map((o, j) => {
      let cls = '';
      if (ans[i] != null && reveal(i)) { if (j === it.c) cls = 'ok'; else if (j === ans[i]) cls = 'bad'; }
      else if (ans[i] === j) cls = 'sel';
      return '<button class="opt ' + cls + '" data-' + name + '="' + i + ':' + j + '"' + (cls === 'sel' ? ' style="border-color:var(--primary)"' : '') + '>' + 'ABCD'[j] + ') ' + L(o) + '</button>';
    }).join('') + '</div></div>').join('');
}
const R = {
  intro: () => '<div class="center"><div class="huge">🌱☀️🌿</div><h2>' + L({ kk: 'Фотосинтез', ru: 'Фотосинтез', en: 'Photosynthesis' }) + '</h2>' +
    '<p>' + L({ kk: 'Өсімдік қалай «тамақтанады»? Күн сәулесі, су және ауа өсімдікке не береді?', ru: 'Как растение «питается»? Что дают растению солнечный свет, вода и воздух?', en: 'How does a plant "eat"? What do sunlight, water and air give a plant?' }) + '</p>' +
    '<p class="muted">' + L({ kk: 'Сабақ мақсаты: фотосинтез процесін түсіндіру және оның тіршілік үшін маңызын анықтау.', ru: 'Цель урока: объяснить процесс фотосинтеза и определить его значение для жизни.', en: 'Lesson goal: explain photosynthesis and why it matters for life.' }) + '</p></div>',
  def: () => '<h2>' + L({ kk: 'Фотосинтез дегеніміз не?', ru: 'Что такое фотосинтез?', en: 'What is photosynthesis?' }) + '</h2>' +
    '<p>' + L({ kk: '<b>Фотосинтез</b> — жасыл өсімдіктердің күн жарығының энергиясын пайдаланып, көмірқышқыл газы мен судан органикалық зат (глюкоза) түзіп, оттегі бөлу процесі.', ru: '<b>Фотосинтез</b> — процесс, при котором зелёные растения с помощью энергии солнечного света образуют из углекислого газа и воды органическое вещество (глюкозу) и выделяют кислород.', en: '<b>Photosynthesis</b> is the process in which green plants use the energy of sunlight to make organic matter (glucose) from carbon dioxide and water, releasing oxygen.' }) + '</p>' +
    '<p class="muted">' + L({ kk: '«Фото» — жарық, «синтез» — құрастыру.', ru: '«Фото» — свет, «синтез» — соединение.', en: '"Photo" means light, "synthesis" means putting together.' }) + '</p>' +
    '<div class="facts">' +
    '<div class="fact"><div class="e">🍃</div><b>' + L({ kk: 'Қайда?', ru: 'Где?', en: 'Where?' }) + '</b><br>' + L({ kk: 'Жапырақ жасушаларындағы хлоропластарда', ru: 'В хлоропластах клеток листа', en: 'In chloroplasts of leaf cells' }) + '</div>' +
    '<div class="fact"><div class="e">🟢</div><b>' + L({ kk: 'Немен?', ru: 'Чем?', en: 'With what?' }) + '</b><br>' + L({ kk: 'Хлорофилл — жарықты сіңіретін жасыл пигмент', ru: 'Хлорофилл — зелёный пигмент, поглощающий свет', en: 'Chlorophyll — a green pigment that absorbs light' }) + '</div>' +
    '<div class="fact"><div class="e">☀️</div><b>' + L({ kk: 'Қашан?', ru: 'Когда?', en: 'When?' }) + '</b><br>' + L({ kk: 'Жарық болғанда', ru: 'Когда есть свет', en: 'When there is light' }) + '</div></div>',
  proc: () => '<h2>' + L({ kk: 'Процесс қалай жүреді?', ru: 'Как идёт процесс?', en: 'How does it work?' }) + '</h2>' +
    '<div class="flow"><div class="box"><b>' + L({ kk: 'Кіреді', ru: 'Поступает', en: 'In' }) + '</b>💧 H₂O<br>💨 CO₂</div><div class="arr">➜</div>' +
    '<div class="box"><b>' + L({ kk: 'Хлоропласт', ru: 'Хлоропласт', en: 'Chloroplast' }) + '</b>☀️ + 🌿</div><div class="arr">➜</div>' +
    '<div class="box"><b>' + L({ kk: 'Шығады', ru: 'Образуется', en: 'Out' }) + '</b>🍬 C₆H₁₂O₆<br>🫧 O₂</div></div>' +
    '<div class="eq">6CO₂ + 6H₂O <span style="color:var(--amber)">—☀️→</span> C₆H₁₂O₆ + 6O₂</div>' +
    '<ol><li>' + L({ kk: 'Тамыр топырақтан су сорады.', ru: 'Корни всасывают воду из почвы.', en: 'Roots take up water from the soil.' }) + '</li>' +
    '<li>' + L({ kk: 'Жапырақ лептесіктері арқылы CO₂ кіреді.', ru: 'Через устьица листа поступает CO₂.', en: 'CO₂ enters through stomata in the leaf.' }) + '</li>' +
    '<li>' + L({ kk: 'Хлорофилл күн жарығын сіңіреді.', ru: 'Хлорофилл поглощает солнечный свет.', en: 'Chlorophyll absorbs sunlight.' }) + '</li>' +
    '<li>' + L({ kk: 'Глюкоза түзіледі, оттегі ауаға бөлінеді.', ru: 'Образуется глюкоза, кислород выделяется в воздух.', en: 'Glucose is made and oxygen is released into the air.' }) + '</li></ol>',
  quiz: () => '<h2>' + L(SLIDES[3].t) + '</h2>' + qBlock(QUIZ, quizA, 'qz', () => true),
  test: () => '<h2>' + L(SLIDES[4].t) + '</h2>' + qBlock(TEST, testA, 'ts', () => testChecked) +
    '<div class="row" style="justify-content:center">' + (testChecked
      ? '<div class="score">' + App.t('result') + ': ' + TEST.filter((q, i) => testA[i] === q.c).length + ' / ' + TEST.length + '</div><button class="btn" id="tAgain">' + App.t('again') + '</button>'
      : '<button class="btn green" id="tCheck">' + App.t('check') + '</button>') + '</div>',
  game: () => {
    if (!game) {
      const idx = PAIRS.map((_, i) => i);
      game = { L: shuffle(idx.slice()), R: shuffle(idx.slice()), sel: null, ok: [] };
    }
    const cell = (side, i) => '<button class="cell ' + (game.ok.includes(i) ? 'ok' : game.sel === side + i ? 'sel' : '') + '" data-g="' + side + i + '">' + L(PAIRS[i][side === 'L' ? 0 : 1]) + '</button>';
    return '<h2>' + L({ kk: 'Сәйкестендіру ойыны', ru: 'Игра «Найди пару»', en: 'Matching game' }) + '</h2><p class="muted">' + App.t('gameHint') + '</p>' +
      '<div class="game"><div class="col">' + game.L.map(i => cell('L', i)).join('') + '</div><div class="col">' + game.R.map(i => cell('R', i)).join('') + '</div></div>' +
      (game.ok.length === PAIRS.length ? '<div class="score">' + App.t('win') + '</div><div class="center"><button class="btn" id="gAgain">' + App.t('again') + '</button></div>' : '');
  },
  sum: () => '<h2>' + L({ kk: 'Қорытынды', ru: 'Итог', en: 'Summary' }) + '</h2><div class="facts">' +
    [['☀️', { kk: 'Фотосинтезге жарық қажет', ru: 'Для фотосинтеза нужен свет', en: 'Photosynthesis needs light' }],
     ['🌿', { kk: 'Хлоропласта, хлорофилл көмегімен жүреді', ru: 'Идёт в хлоропластах с помощью хлорофилла', en: 'Happens in chloroplasts with chlorophyll' }],
     ['🍬', { kk: 'Глюкоза — өсімдіктің қоректік заты', ru: 'Глюкоза — питательное вещество растения', en: 'Glucose is the plant\'s food' }],
     ['🫧', { kk: 'Оттегі — барлық тірі ағзаларға тыныс алу үшін қажет', ru: 'Кислород нужен для дыхания всем живым организмам', en: 'Oxygen is needed by all living things to breathe' }]]
      .map(f => '<div class="fact"><div class="e">' + f[0] + '</div>' + L(f[1]) + '</div>').join('') + '</div>' +
    '<p class="center" style="margin-top:24px"><a class="btn primary" href="reflection.html">🙋 ' + L({ kk: 'Рефлексияға өту', ru: 'Перейти к рефлексии', en: 'Go to reflection' }) + '</a></p>'
};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function render() {
  $('dots').innerHTML = SLIDES.map((s, i) => '<button class="' + (i === cur ? 'on' : '') + '" data-s="' + i + '">' + L(s.t) + '</button>').join('');
  $('slide').innerHTML = R[SLIDES[cur].id]();
  $('slide').style.animation = 'none'; void $('slide').offsetWidth; $('slide').style.animation = '';
  $('ctr').textContent = (cur + 1) + ' / ' + SLIDES.length;
  $('prev').disabled = cur === 0; $('next').disabled = cur === SLIDES.length - 1;
}
function go(i) { cur = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); scrollTo({ top: 0, behavior: 'smooth' }); }
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
$('dots').onclick = e => { const b = e.target.closest('[data-s]'); if (b) go(+b.dataset.s); };
$('slide').onclick = e => {
  const qz = e.target.closest('[data-qz]'), ts = e.target.closest('[data-ts]'), g = e.target.closest('[data-g]');
  if (qz) { const [i, j] = qz.dataset.qz.split(':').map(Number); if (quizA[i] == null) { quizA[i] = j; App.beep(j === QUIZ[i].c ? 990 : 220, 0.2); render(); } }
  else if (ts && !testChecked) { const [i, j] = ts.dataset.ts.split(':').map(Number); testA[i] = j; render(); }
  else if (e.target.id === 'tCheck') { testChecked = true; App.fanfare(); render(); }
  else if (e.target.id === 'tAgain') { testA = {}; testChecked = false; render(); }
  else if (e.target.id === 'gAgain') { game = null; render(); }
  else if (g) {
    const side = g.dataset.g[0], i = +g.dataset.g.slice(1);
    if (game.ok.includes(i)) return;
    if (!game.sel || game.sel[0] === side) { game.sel = side + i; render(); return; }
    const other = +game.sel.slice(1);
    if (other === i) { game.ok.push(i); game.sel = null; App.beep(990, 0.15); if (game.ok.length === PAIRS.length) App.fanfare(); render(); }
    else { game.sel = null; App.beep(200, 0.2); render(); const el = $('slide').querySelector('[data-g="' + side + i + '"]'); if (el) el.classList.add('bad'); }
  }
};
document.addEventListener('keydown', e => { if (e.target.matches('input,textarea')) return; if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1); });
App.onLang.push(render);
render();
</script>
