<!doctype html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сабақ таймері</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏱️%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css?v=20261030">
<style>
  .stage { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }
  .face { text-align: center; padding: 28px 16px; background: linear-gradient(135deg, #4c6ef5, #7048e8 55%, #c2255c); color: #fff; border: 0; }
  .face.done { background: linear-gradient(135deg, #e03131, #f08c00); }
  .ring { width: min(78vw, 420px); aspect-ratio: 1; margin: 0 auto; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 10; }
  .ring .bgc { stroke: rgba(255,255,255,.22); }
  .ring .fg { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .ring .fg.warn { stroke: #ffd43b; }
  .time { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(56px, 15vw, 120px); font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: 2px; text-shadow: 0 4px 20px rgba(0,0,0,.25); }
  .time.warn { color: #ffd43b; animation: pulse 1s ease-in-out infinite; }
  .msg { font-size: clamp(22px, 4vw, 34px); font-weight: 900; min-height: 1.3em; margin-top: 8px; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .face .ctl { justify-content: center; margin-top: 18px; }
  .face .btn { background: rgba(255,255,255,.18); color: #fff; border-color: rgba(255,255,255,.35); font-size: 18px; padding: 12px 22px; }
  .face .btn.main { background: #fff; color: #3b5bdb; }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .presets .btn { padding: 12px 4px; font-size: 17px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .side > .card + .card { margin-top: 16px; }
  .custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .custom input { width: 76px; font-size: 20px; text-align: center; font-weight: 800; }
  .opt { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .opt:first-of-type { border-top: 0; }
  .label-in { width: 100%; font-size: 18px; }
  .face .lbl { font-size: 22px; font-weight: 800; opacity: .95; min-height: 1.4em; margin-bottom: 8px; }
  :fullscreen .face { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; border-radius: 0; }
  :fullscreen .ring { width: min(80vh, 90vw); }
  :fullscreen .time { font-size: min(22vh, 18vw); }
</style>
</head>
<body>
<main class="wrap">
  <div class="stage">
    <section class="card face" id="face">
      <div class="lbl" id="lblShow"></div>
      <div class="ring">
        <svg viewBox="0 0 220 220"><circle class="bgc" cx="110" cy="110" r="100"/><circle class="fg" id="arc" cx="110" cy="110" r="100"/></svg>
        <div class="time" id="time">05:00</div>
      </div>
      <div class="msg" id="msg"></div>
      <div class="row ctl">
        <button class="btn main" id="start" data-i="start"></button>
        <button class="btn" id="reset" data-i="reset"></button>
        <button class="btn" id="plus">+1 <span data-i="min"></span></button>
        <button class="btn" id="fs" data-it="full">⛶</button>
      </div>
    </section>
    <aside class="side">
      <div class="card">
        <h2 data-i="presets"></h2>
        <div class="presets" id="presets"></div>
      </div>
      <div class="card">
        <h2 data-i="custom"></h2>
        <div class="custom">
          <input type="number" id="cm" min="0" max="180" value="7"> <span data-i="min"></span>
          <input type="number" id="cs" min="0" max="59" value="0"> <span data-i="sec"></span>
          <button class="btn primary" id="set" data-i="set"></button>
        </div>
      </div>
      <div class="card">
        <h2 data-i="settings"></h2>
        <input type="text" class="label-in" id="lbl" data-ip="labelPh">
        <div class="opt"><span data-i="sound"></span><input type="checkbox" id="snd" checked></div>
        <div class="opt"><span data-i="tick"></span><input type="checkbox" id="tick"></div>
        <div class="opt"><span data-i="up"></span><input type="checkbox" id="countUp"></div>
        <p class="muted" style="margin:8px 0 0;font-size:14px" data-i="keys"></p>
      </div>
    </aside>
  </div>
</main>
<script src="common.js?v=20261030"></script>
<script>
App.init({
  pageTitle: { kk: 'Сабақ таймері', ru: 'Таймер для урока', en: 'Lesson timer' },
  start: { kk: 'Бастау', ru: 'Старт', en: 'Start' },
  pause: { kk: 'Кідірту', ru: 'Пауза', en: 'Pause' },
  resume: { kk: 'Жалғастыру', ru: 'Продолжить', en: 'Resume' },
  reset: { kk: 'Қайта', ru: 'Сброс', en: 'Reset' },
  min: { kk: 'мин', ru: 'мин', en: 'min' },
  sec: { kk: 'сек', ru: 'сек', en: 'sec' },
  set: { kk: 'Орнату', ru: 'Установить', en: 'Set' },
  full: { kk: 'Толық экран', ru: 'Полный экран', en: 'Full screen' },
  presets: { kk: 'Дайын уақыт', ru: 'Готовое время', en: 'Presets' },
  custom: { kk: 'Өз уақытыңыз', ru: 'Своё время', en: 'Custom time' },
  settings: { kk: 'Баптаулар', ru: 'Настройки', en: 'Settings' },
  labelPh: { kk: 'Тапсырма атауы (мыс.: Топтық жұмыс)', ru: 'Название задания (напр.: Работа в группах)', en: 'Task name (e.g. Group work)' },
  sound: { kk: 'Соңында дыбыс', ru: 'Звук в конце', en: 'Sound at the end' },
  tick: { kk: 'Соңғы 10 секундта санау дыбысы', ru: 'Отсчёт звуком последние 10 секунд', en: 'Tick in the last 10 seconds' },
  up: { kk: 'Уақыт біткен соң асқан уақытты санау', ru: 'После окончания считать перерасход', en: 'Count overtime after the end' },
  keys: { kk: 'Пернелер: Бос орын — бастау/кідірту, R — қайта, F — толық экран.', ru: 'Клавиши: Пробел — старт/пауза, R — сброс, F — полный экран.', en: 'Keys: Space — start/pause, R — reset, F — full screen.' },
  done: { kk: 'Уақыт бітті!', ru: 'Время вышло!', en: 'Time\'s up!' },
  last: { kk: 'Соңғы минут!', ru: 'Последняя минута!', en: 'Last minute!' }
});

const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 100;
$('arc').style.strokeDasharray = C;
const PRESETS = [1, 2, 3, 5, 7, 10, 15, 20, 25, 30, 40, 45];
$('presets').innerHTML = PRESETS.map(m => '<button class="btn" data-m="' + m + '">' + m + ' <span data-i="min"></span></button>').join('');
App.apply($('presets'));

// base — таңдалған уақыт; total — ағымдағы айналым (+1 мин оны ғана ұлғайтады)
let base = App.store.get('mt-timer-total', 300), total = base, left = total, running = false, endAt = 0, over = 0, finished = false, raf = 0, lastSec = -1;
const opts = App.store.get('mt-timer-opts', { snd: true, tick: false, countUp: false, lbl: '' });
['snd', 'tick', 'countUp'].forEach(k => { $(k).checked = !!opts[k]; $(k).onchange = () => { opts[k] = $(k).checked; App.store.set('mt-timer-opts', opts); }; });
$('lbl').value = opts.lbl || '';
$('lbl').oninput = () => { opts.lbl = $('lbl').value; $('lblShow').textContent = opts.lbl; App.store.set('mt-timer-opts', opts); };
$('lblShow').textContent = opts.lbl || '';

function fmt(s) {
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(ss).padStart(2, '0');
}
function draw() {
  const frac = total ? Math.max(0, left) / total : 0;
  $('arc').style.strokeDashoffset = C * (1 - frac);
  const warn = !finished && left <= Math.min(60, total * 0.2) && left > 0;
  $('arc').classList.toggle('warn', warn);
  $('time').classList.toggle('warn', warn && running);
  $('time').textContent = finished && opts.countUp ? '+' + fmt(over) : fmt(left);
  $('face').classList.toggle('done', finished);
  $('msg').textContent = finished ? App.t('done') : (warn && left <= 60 && total > 120 ? App.t('last') : '');
  $('start').textContent = App.t(running ? 'pause' : (left < total && !finished ? 'resume' : 'start'));
}
function loop() {
  const now = performance.now();
  if (!finished) {
    left = (endAt - now) / 1000;
    const s = Math.ceil(left);
    if (s !== lastSec) {
      lastSec = s;
      if (opts.tick && s <= 10 && s > 0) App.beep(s <= 3 ? 1000 : 700, 0.08, 'square');
    }
    if (left <= 0) {
      left = 0; finished = true;
      if (opts.snd) App.fanfare();
      if (!opts.countUp) { running = false; draw(); return; }
    }
  } else {
    over = (now - endAt) / 1000;
  }
  draw();
  raf = requestAnimationFrame(loop);
}
function start() {
  if (finished) reset();
  if (running) { running = false; cancelAnimationFrame(raf); draw(); return; }
  App.beep(1, 0.01);
  running = true; endAt = performance.now() + left * 1000; loop();
}
function reset() { running = false; finished = false; cancelAnimationFrame(raf); total = base; left = total; over = 0; lastSec = -1; draw(); }
function setTotal(s) { base = Math.max(1, Math.round(s)); App.store.set('mt-timer-total', base); reset(); }

$('start').onclick = start;
$('reset').onclick = reset;
$('plus').onclick = () => {
  if (finished) { finished = false; left = 60; total = Math.max(total, 60); }
  else { left += 60; total += 60; }
  if (running) endAt = performance.now() + left * 1000;
  draw();
};
$('fs').onclick = () => App.fullscreen($('face'));
$('presets').onclick = e => { const b = e.target.closest('[data-m]'); if (b) setTotal(+b.dataset.m * 60); };
$('set').onclick = () => setTotal((+$('cm').value || 0) * 60 + (+$('cs').value || 0));
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); start(); }
  else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') reset();
  else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') App.fullscreen($('face'));
});
App.onLang.push(draw);
draw();
</script>
</body>
</html>
