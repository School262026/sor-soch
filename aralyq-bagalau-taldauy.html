<style>

  h3 { margin: 16px 0 8px; font-size: 16px; }
  .g4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .fld { display: grid; gap: 4px; margin: 6px 0; }
  .fld > span { font-weight: 800; font-size: 14px; }
  .fld small, small.muted { color: var(--muted); font-size: 13px; }
  .po { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; background: var(--bg); }
  .po .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .po .ph b { font-size: 18px; }
  .trow { display: grid; grid-template-columns: 90px 1fr 80px auto; gap: 6px; align-items: center; margin: 4px 0; }
  .scroll { overflow-x: auto; }
  table.sc { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.sc th, table.sc td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; white-space: nowrap; }
  table.sc th:nth-child(2), table.sc td:nth-child(2) { text-align: left; }
  table.sc input { width: 64px; text-align: center; padding: 5px; }
  .pct { color: var(--muted); font-size: 13px; }
  .lv-h { color: var(--green); font-weight: 800; } .lv-m { color: var(--amber); font-weight: 800; } .lv-l { color: var(--red); font-weight: 800; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; } .kpi b { font-size: 18px; display: block; }
  .goal { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .goal .gp { margin-left: auto; white-space: nowrap; font-weight: 800; font-size: 13px; }
  .pick { display: grid; gap: 4px; }
  .pick label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 10px; cursor: pointer; }
  .pick label:hover { background: var(--bg); }
  .pick label.auto { background: var(--green-soft); }
  .pick input { margin-top: 3px; }
  .bar { background: var(--green-soft); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .paper { background: #fff; color: #000; border-radius: 6px; padding: 28px 30px; box-shadow: var(--shadow); font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.35; overflow-x: auto; }

  <section class="card hide" id="s2">

    <button class="btn primary" id="addPo" data-i="addPo"></button>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn green" data-go="3" data-i="next"></button></div>
  </section>

  <section class="card hide" id="s3">
    <h2 data-i="st3"></h2>
    <div class="scroll" id="grid"></div>
    <div class="kpis" id="kpis"></div>
    <div id="tsec"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn green" data-go="4" data-i="next"></button></div>
  </section>

  <section class="card hide" id="s4">

    <h3 data-i="cT"></h3><div class="pick" id="pc"></div><textarea id="cc" rows="2" data-ip="ownPh"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn green" data-go="5" data-i="next"></button></div>
  </section>

  <section class="hide" id="s5">
    <div class="actions no-print">
      <button class="btn primary" id="word" data-i="word"></button>
      <button class="btn green" id="pdf" data-i="pdf"></button>
      <button class="btn" id="print" data-i="print"></button>

    </div>

  </section>

    <p class="note" data-i="privacy"></p></section>
</main>

function po(n, grade) { return { n, unit: '', max: AO_MAX[grade] || 16, goals: '', tasks: [], dif: {}, scores: {}, ts: {} }; }
const today = () => new Date().toISOString().slice(0, 10);
const blank = () => ({ id: Date.now(), grade: 4, letter: '', subject: '', term: 1, teacher: '', date: today(), docLang: App.lang, qualMode: 'dash', roster: '', pos: [po(1, 4), po(2, 4)], allAch: true, sel: { d: {}, r: {}, c: {} }, auto: { d: {}, r: {}, c: {} }, own: { d: '', r: '', c: '' }, mon: false });
let A = App.store.get('mt-po-cur') || blank();
let saved = App.store.get('mt-po-saved', []);
const save = () => App.store.set('mt-po-cur', A);
const students = () => A.roster.split('\n').map(s => s.trim()).filter(Boolean);
const goalsOf = p => p.goals.split('\n').map(s => s.trim()).filter(Boolean);
const poName = (p, lang) => ((lang || A.docLang) === 'ru' ? 'ПО № ' : 'АБ № ') + p.n;
const sc = (p, si) => { const v = p.scores[si]; return v === '' || v == null ? null : +v; };
const pct = (p, si) => { const v = sc(p, si); return v == null ? null : v / (+p.max || 1) * 100; };
const clsName = () => A.grade + (A.letter ? (A.docLang === 'ru' ? ' «' + A.letter + '»' : ' «' + A.letter + '»') : '');
function stats(p) {
  let n = 0, h = 0, m = 0, l = 0, q = 0, u = 0;
  students().forEach((_, si) => { const x = pct(p, si); if (x == null) return; n++; const v = lvOf(x); v === 'h' ? h++ : v === 'm' ? m++ : l++; if (x >= 65) q++; if (x >= 40) u++; });
  return { n, h, m, l, q: n ? Math.round(q / n * 100) : 0, u: n ? Math.round(u / n * 100) : 0 };
}
function taskPct(p, k) {
  const m = +p.tasks[k].max || 1; let s = 0, n = 0;
  students().forEach((_, si) => { const v = (p.ts[si] || {})[k]; if (v !== '' && v != null) { s += +v; n++; } });
  return n ? s / (n * m) * 100 : null;
}
// мақсаттың орындалуы = оған қатысты тапсырмалардың орташа пайызы
function goalPct(p, gi) {
  const ks = p.tasks.map((tk, k) => +tk.g === gi ? k : -1).filter(k => k >= 0);
  const ps = ks.map(k => taskPct(p, k)).filter(x => x != null);
  return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
}

  $('grade').value = A.grade; $('term').value = A.term; $('docLang').value = A.docLang; $('qualMode').value = A.qualMode;
  ['letter', 'subject', 'teacher', 'date'].forEach(k => { if (document.activeElement !== $(k)) $(k).value = A[k] || ''; });
  if (document.activeElement !== $('roster')) $('roster').value = A.roster;
  $('subjList').innerHTML = SUBJ[App.lang].map(s => '<option value="' + esc(s) + '">').join('');
}

$('pos').oninput = e => {

  else if (el.dataset.tk) { const [i, k, f] = el.dataset.tk.split(':'); A.pos[i].tasks[k][f] = +el.value; recalcMax(A.pos[i]); save(); }

$('pos').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.rmpo != null) { A.pos.splice(+d.rmpo, 1); A.pos.forEach((p, i) => p.n = i + 1); }
  else if (d.addt != null) { const p = A.pos[d.addt]; p.tasks.push({ g: Math.min(p.tasks.length, Math.max(0, goalsOf(p).length - 1)), max: 2 }); recalcMax(p); }
  else if (d.rmt) { const [i, k] = d.rmt.split(':'); A.pos[i].tasks.splice(k, 1); Object.values(A.pos[i].ts).forEach(r => { delete r[k]; }); recalcMax(A.pos[i]); }

function recalcMax(p) { if (p.tasks.length) p.max = p.tasks.reduce((a, tk) => a + (+tk.max || 0), 0); }

    '<div class="scroll"><table class="sc"><thead><tr><th>№</th><th>' + t('name') + '</th>' + p.tasks.map((tk, k) => '<th>' + (k + 1) + '<br><span class="pct">max ' + tk.max + '</span></th>').join('') + '<th>Σ</th></tr></thead><tbody>' +
    st.map((s, si) => '<tr><td>' + (si + 1) + '</td><td>' + esc(s) + '</td>' + p.tasks.map((tk, k) => '<td><input type="number" min="0" max="' + tk.max + '" data-t="' + si + ':' + k + '" value="' + nz((p.ts[si] || {})[k]) + '"></td>').join('') + '<td><b>' + nz(sc(p, si)) + '</b></td></tr>').join('') +
    '<tr><td></td><td><b>%</b></td>' + p.tasks.map((tk, k) => { const x = taskPct(p, k); return '<td><b class="' + (x == null ? '' : x >= 65 ? 'lv-h' : 'lv-l') + '">' + (x == null ? '' : Math.round(x) + '%') + '</b></td>'; }).join('') + '<td></td></tr></tbody></table></div>';
}
function setTask(p, si, k, v) {
  (p.ts[si] = p.ts[si] || {})[k] = v;
  const vals = Object.values(p.ts[si]).filter(x => x !== '' && x != null);
  p.scores[si] = vals.length ? vals.reduce((a, b) => a + +b, 0) : '';
}
$('s3').addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.c) { const [pi, si] = el.dataset.c.split(':'); A.pos[pi].scores[si] = el.value; }
  else if (el.dataset.t) { const [si, k] = el.dataset.t.split(':'); setTask(A.pos[tp], si, k, el.value); }
  else return;
  save(); renderGrid();
});
$('s3').addEventListener('click', e => { const b = e.target.closest('[data-tp]'); if (b) { tp = +b.dataset.tp; renderGrid(); } });
$('s3').addEventListener('paste', e => {
  const el = e.target, txt = (e.clipboardData || window.clipboardData).getData('text');
  if (!txt || !/[\n\t]/.test(txt.trim()) || !(el.dataset.c || el.dataset.t)) return;
  e.preventDefault();
  const rows = txt.trim().split(/\r?\n/).map(r => r.split('\t').map(v => v.trim().replace(',', '.')));
  const n = students().length;
  if (el.dataset.c) { const [pi, si] = el.dataset.c.split(':').map(Number); rows.forEach((r, a) => r.forEach((v, b) => { const p = A.pos[pi + b]; if (p && !p.tasks.length && si + a < n) p.scores[si + a] = v; })); }
  else { const [si, k] = el.dataset.t.split(':').map(Number), p = A.pos[tp]; rows.forEach((r, a) => r.forEach((v, b) => { if (si + a < n && k + b < p.tasks.length) setTask(p, si + a, k + b, v); })); }
  save(); renderGrid();
});

// ---- ④ белгілеу
const bankOf = () => BANK[subjKey(A.subject)];
function lowNames() {
  const st = students(), low = new Set(), mid = new Set();
  A.pos.forEach(p => st.forEach((s, si) => { const x = pct(p, si); if (x == null) return; if (x < 40) low.add(s); else if (x < 65) mid.add(s); }));
  low.forEach(s => mid.delete(s));
  return { low: [...low], mid: [...mid] };
}
const stripCode = g => g.replace(/^\s*[\d.]+\*{0,2}\s*[–—-]?\s*/, '').trim();
// тізімдер: банк + мақсаттан жасалған + аты-жөнмен жасалған пункттер
function items(kind) {
  const L = A.docLang, b = bankOf(), out = [];
  if (kind === 'd') A.pos.forEach((p, pi) => goalsOf(p).forEach((g, gi) => { if (p.dif[gi]) out.push({ id: 'g' + pi + '_' + gi, text: L === 'ru' ? 'Затруднения при выполнении заданий по цели «' + stripCode(g) + '».' : '«' + stripCode(g) + '» мақсаты бойынша тапсырмаларды орындауда қиналады.' }); }));
  b[kind].forEach((x, i) => out.push({ id: 'b' + i, text: x[L] }));
  if (kind === 'c') {
    const nm = lowNames();
    if (nm.low.length) out.push({ id: 'nlow', text: L === 'ru' ? 'Организовать индивидуальную работу и консультации с обучающимися низкого уровня: ' + nm.low.join(', ') + '.' : 'Төмен деңгейдегі білім алушылармен жеке жұмыс және кеңес беру: ' + nm.low.join(', ') + '.' });
    if (nm.mid.length) out.push({ id: 'nmid', text: L === 'ru' ? 'Дать дополнительные разноуровневые задания обучающимся (40–64%): ' + nm.mid.join(', ') + '.' : 'Келесі білім алушыларға (40–64%) деңгейлік қосымша тапсырмалар беру: ' + nm.mid.join(', ') + '.' });
  }
  return out;
}
function renderGoals() {
  $('allAch').checked = A.allAch;
  $('goals').innerHTML = A.pos.map((p, pi) => '<p style="margin:10px 0 2px"><b>' + esc(poName(p, App.lang)) + (p.unit ? ' — ' + esc(p.unit) : '') + '</b></p>' +
    (goalsOf(p).map((g, gi) => { const x = goalPct(p, gi); return '<label class="goal"><input type="checkbox" data-dg="' + pi + ':' + gi + '"' + (p.dif[gi] ? ' checked' : '') + '><span>' + esc(g) + '</span><span class="gp ' + (x == null ? '' : x >= 65 ? 'lv-h' : 'lv-l') + '">' + (x == null ? '' : Math.round(x) + '%') + (p.dif[gi] ? ' · ' + t('difW') : '') + '</span></label>'; }).join('') || '<p class="muted">—</p>')).join('');
}
function renderPick() {
  ['d', 'r', 'c'].forEach(k => {
    $('p' + k).innerHTML = items(k).map(it => '<label class="' + (A.auto[k][it.id] ? 'auto' : '') + '"><input type="checkbox" data-pk="' + k + ':' + it.id + '"' + (A.sel[k][it.id] ? ' checked' : '') + '><span>' + esc(it.text) + '</span></label>').join('');
    $('c' + k).value = A.own[k] || '';
  });
}
$('goals').onchange = e => { const k = e.target.dataset.dg; if (!k) return; const [pi, gi] = k.split(':'); A.pos[pi].dif[gi] = e.target.checked; save(); renderGoals(); renderPick(); };
$('allAch').onchange = () => { A.allAch = $('allAch').checked; save(); };
['d', 'r', 'c'].forEach(k => {
  $('p' + k).onchange = e => { const v = e.target.dataset.pk; if (!v) return; const id = v.split(':')[1]; A.sel[k][id] = e.target.checked; save(); };
  $('c' + k).oninput = () => { A.own[k] = $('c' + k).value; save(); };
});
function autoMark() {
  const b = bankOf(), txt = [];
  A.pos.forEach(p => {
    const gl = goalsOf(p);
    gl.forEach((g, gi) => { const x = goalPct(p, gi); if (x != null) p.dif[gi] = x < 65; });
    // тапсырма жоқ болса: ең әлсіз нәтиже көрсеткен аралық бағалаудың мақсаттарын белгілемейміз — мұғалім өзі белгілейді
    gl.forEach((g, gi) => { if (p.dif[gi]) txt.push(g.toLowerCase()); });
  });
  const hay = txt.join(' ');
  A.sel = { d: {}, r: {}, c: {} }; A.auto = { d: {}, r: {}, c: {} };
  const mark = (k, id) => { A.sel[k][id] = true; A.auto[k][id] = true; };
  items('d').filter(it => it.id[0] === 'g').forEach(it => mark('d', it.id));
  const hit = b.d.map((x, i) => (x.kw || []).some(w => hay.includes(w)) ? i : -1).filter(i => i >= 0);
  const anyDif = txt.length > 0, weak = A.pos.some(p => { const s = stats(p); return s.n && (s.l > 0 || s.h < s.n / 2); });
  (hit.length ? hit : (anyDif || weak ? [0, 1] : [])).forEach(i => { if (b.d[i]) mark('d', 'b' + i); });
  const nr = hit.length ? Math.min(b.r.length, Math.max(2, hit.length)) : (anyDif || weak ? 2 : 1);
  for (let i = 0; i < nr; i++) mark('r', 'b' + i);
  const nc = Math.min(b.c.length, Math.max(3, hit.length + 1));
  hit.forEach(i => { if (b.c[i]) mark('c', 'b' + i); });
  for (let i = 0; Object.keys(A.sel.c).length < nc && i < b.c.length; i++) mark('c', 'b' + i);
  if (!A.sel.c['b' + (b.c.length - 1)]) mark('c', 'b' + (b.c.length - 1));
  const nm = lowNames(); if (nm.low.length) mark('c', 'nlow'); if (nm.mid.length) mark('c', 'nmid');
  save();
}
$('autoBtn').onclick = () => { autoMark(); renderGoals(); renderPick(); };

  }
  const d = A.date ? A.date.slice(8, 10) + '.' + A.date.slice(5, 7) + '.' + A.date.slice(0, 4) : '';
  h += '<p style="margin-top:18px">' + (ru ? 'Дата' : 'Күні') + ': ' + d + (ru ? ' г.' : ' ж.') + ' &nbsp;&nbsp;&nbsp;&nbsp; ' + (ru ? 'ФИО педагога' : 'Педагогтің аты-жөні') + ': ' + esc(A.teacher) + ' ____________</p>';
  return h;
}
function fileBase() { return ((A.docLang === 'ru' ? 'Анализ_ПО_' : 'АБ_талдау_') + clsName() + '_' + (A.subject || '') + '_' + A.term).replace(/[\\/:*?"<>|«»\s]+/g, '_'); }
function exportWord() {
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>' +
    'body{font-family:"Times New Roman";font-size:12pt} h1{font-size:13pt;text-align:center} table{border-collapse:collapse;width:100%} td,th{border:1px solid #000;padding:2pt 4pt;vertical-align:top;text-align:center;font-size:11pt} td.l{text-align:left} p{margin:3pt 0}' +
    '@page{size:21cm 29.7cm;margin:1.5cm 1.5cm 1.5cm 2cm}</style></head><body>' + docHtml() + '</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + html], { type: 'application/msword' }));
  a.download = fileBase() + '.doc'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// PDF: html2pdf кітапханасы тек батырма басылғанда жүктеледі
function loadPdfLib() {
  return new Promise((res, rej) => {
    if (window.html2pdf) return res();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload = res; s.onerror = rej; document.head.append(s);
  });
}
async function exportPdf() {
  const btn = $('pdf'), old = btn.textContent; btn.textContent = t('pdfWait'); btn.disabled = true;
  try {
    await loadPdfLib();
    const el = document.createElement('div');
    el.className = 'paper'; el.style.cssText = 'width:720px;box-shadow:none;border-radius:0;padding:0;overflow:visible';
    el.innerHTML = docHtml();
    await html2pdf().set({ margin: [12, 12, 12, 15], filename: fileBase() + '.pdf', image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }, pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', 'p'] } }).from(el).save();
  } catch (e) { print(); }
  btn.textContent = old; btn.disabled = false;
}
$('word').onclick = exportWord; $('pdf').onclick = exportPdf; $('print').onclick = () => print();
$('mon').onchange = () => { A.mon = $('mon').checked; save(); $('paper').innerHTML = docHtml(); };

// ---- сақтау, үлгі
function renderSaved() {
  $('savedList').innerHTML = saved.length ? saved.map((s, i) => '<li><span><b>' + esc(s.subject || '—') + '</b> · ' + esc(s.grade + (s.letter || '')) + ' · ' + s.term + ' ' + (App.lang === 'ru' ? 'четв.' : 'тоқсан') + ' <span class="muted">· ' + esc(s.when || '') + '</span></span><span class="row"><button class="btn sm primary" data-op="' + i + '">' + t('open') + '</button><button class="btn sm" data-rm="' + i + '">' + t('del') + '</button></span></li>').join('') : '<li class="muted">' + t('none') + '</li>';
}
$('savedList').onclick = e => {
  const o = e.target.closest('[data-op]'), r = e.target.closest('[data-rm]');
  if (o) { A = JSON.parse(JSON.stringify(saved[+o.dataset.op])); save(); all(); step('1'); }
  else if (r) { const i = +r.dataset.rm, x = saved.splice(i, 1)[0]; App.store.set('mt-po-saved', saved); renderSaved(); App.toast(t('doneDel'), () => { saved.splice(i, 0, x); App.store.set('mt-po-saved', saved); renderSaved(); }); }
};
$('saveDoc').onclick = () => {
  const c = JSON.parse(JSON.stringify(A)); c.when = new Date().toLocaleDateString();
  const i = saved.findIndex(s => s.id === A.id); if (i >= 0) saved[i] = c; else saved.unshift(c);
  App.store.set('mt-po-saved', saved); renderSaved();
  $('saveDoc').textContent = t('saved'); setTimeout(() => $('saveDoc').textContent = t('saveDoc'), 1500);
};
$('newDoc').onclick = () => { const old = JSON.stringify(A); A = blank(); save(); all(); step('1'); App.toast(t('doneNew'), () => { A = JSON.parse(old); save(); all(); }); };
$('sample').onclick = () => {
  const old = JSON.stringify(A);
  const ru = App.lang === 'ru';
  A = Object.assign(blank(), { grade: 4, letter: 'F', subject: 'Математика', term: 1, teacher: ru ? 'Иванова А. Б.' : 'Сейтқали А. Б.', docLang: App.lang,
    roster: Array.from({ length: 14 }, (_, i) => (ru ? 'Ученик ' : 'Оқушы ') + (i + 1)).join('\n') });
  const p1 = po(1, 4), p2 = po(2, 4);
  p1.unit = ru ? '«Многозначные числа»' : '«Көп таңбалы сандар»';
  p1.goals = ru ? '4.1.1.3 Определять разрядный и классовый состав многозначных чисел\n4.1.2.8 Применять алгоритмы сложения и вычитания многозначных чисел\n4.1.3.5 Определять доли единиц времени\n4.4.3.1 Определять закономерность в последовательности чисел до 1 000 000'
    : '4.1.1.3 Көп таңбалы сандардың разрядтық және кластық құрамын анықтау\n4.1.2.8 Көп таңбалы сандарды қосу мен азайту алгоритмдерін қолдану\n4.1.3.5 Уақыт бірліктерінің үлестерін анықтау\n4.4.3.1 1 000 000-ға дейінгі сандар тізбегіндегі заңдылықты анықтау';
  p1.tasks = [{ g: 0, max: 4 }, { g: 1, max: 5 }, { g: 2, max: 4 }, { g: 3, max: 3 }];
  const T1 = [[4, 5, 3, 3], [4, 4, 2, 2], [3, 5, 2, 1], [4, 5, 4, 3], [3, 3, 1, 1], [4, 4, 2, 2], [2, 3, 1, 1], [4, 5, 3, 3], [3, 4, 2, 2], [4, 5, 3, 2], [3, 4, 2, 1], [4, 5, 4, 3], [2, 2, 1, 0], [4, 4, 3, 2]];
  T1.forEach((r, si) => r.forEach((v, k) => setTask(p1, si, k, v)));
  p2.unit = ru ? '«Свойства действий»' : '«Амалдардың қасиеттері»';
  p2.goals = ru ? '4.1.2.3 Применять свойства сложения и умножения при вычислениях\n4.1.2.4 Классифицировать числа по признакам делимости на 2, 5, 10\n4.1.2.6 Выполнять деление с остатком и без остатка на 10, 100, 1000'
    : '4.1.2.3 Есептеулерде қосу мен көбейту қасиеттерін қолдану\n4.1.2.4 Сандарды 2, 5, 10-ға бөлінгіштік белгілері бойынша жіктеу\n4.1.2.6 10, 100, 1000-ға қалдықпен және қалдықсыз бөлу';
  p2.tasks = [{ g: 0, max: 6 }, { g: 1, max: 5 }, { g: 2, max: 5 }];
  const T2 = [[5, 4, 2], [6, 5, 3], [4, 4, 2], [6, 5, 4], [3, 3, 1], [5, 4, 3], [2, 2, 1], [6, 5, 4], [4, 4, 2], [5, 5, 3], [4, 3, 2], [6, 5, 5], [3, 2, 0], [5, 4, 3]];
  T2.forEach((r, si) => r.forEach((v, k) => setTask(p2, si, k, v)));
  A.pos = [p1, p2];
  autoMark(); save(); all(); step('5');
  App.toast(t('doneSample'), () => { A = JSON.parse(old); save(); all(); step('1'); });
};

// генератордан келген аралық бағалау
(function importFromGen() {
  const im = App.store.get('mt-po-import'); if (!im || location.hash !== '#import') return;
  App.store.set('mt-po-import', null); history.replaceState(null, '', location.pathname + location.search);
  const sameCls = +A.grade === +im.grade && A.subject === im.subject && +A.term === +im.term;
  if (!sameCls) { A = blank(); A.pos = []; Object.assign(A, { grade: im.grade, letter: im.letter || '', subject: im.subject, term: im.term, docLang: im.docLang || A.docLang }); }
  const p = po(A.pos.length + 1, A.grade);
  Object.assign(p, { unit: im.unit || '', goals: im.goals || '', tasks: im.tasks || [] }); recalcMax(p);
  A.pos.push(p); save();
})();

function step(s) {
  document.querySelectorAll('#steps .btn').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  ['1', '2', '3', '4', '5'].forEach(k => $('s' + k).classList.toggle('hide', k !== s));
  if (s === '2') renderPos(); if (s === '3') renderGrid();
  if (s === '4') { if (!Object.keys(A.sel.d).length && !Object.keys(A.sel.c).length && students().length) autoMark(); renderGoals(); renderPick(); }
  if (s === '5') { $('mon').checked = A.mon; $('paper').innerHTML = docHtml(); }
  scrollTo({ top: 0, behavior: 'smooth' });
}
$('steps').onclick = e => { const b = e.target.closest('[data-s]'); if (b) step(b.dataset.s); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => step(b.dataset.go));
function all() { renderS1(); renderPos(); renderGrid(); renderGoals(); renderPick(); renderSaved(); }
App.onLang.push(l => { A.docLang = l; save(); all(); });
all();
</script>
