<head>
<meta charset="UTF-8">

<meta property="og:title" content="Анализ СОР и СОЧ / БЖБ және ТЖБ талдауы">
<meta property="og:description" content="Баллдарды енгізіңіз — сапа, үлгерім, деңгейлер, диаграмма, Word құжаты өзі дайындалады.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .steps .btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  h2 { margin: 0 0 10px; font-size: 20px; }
  h3 { margin: 16px 0 8px; font-size: 16px; }
  .g4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .fld { display: grid; gap: 4px; margin: 6px 0; }
  .fld > span { font-weight: 800; font-size: 14px; }
  .fld small { color: var(--muted); font-size: 13px; }
  .works { display: grid; gap: 10px; }
  .work { display: grid; grid-template-columns: 70px 80px 1.4fr 1fr auto; gap: 6px; align-items: center; }
  @media (max-width: 640px) { .work { grid-template-columns: 1fr 80px; } }
  .scroll { overflow-x: auto; }
  table.sc { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.sc th, table.sc td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; white-space: nowrap; }
  table.sc th:nth-child(2), table.sc td:nth-child(2) { text-align: left; }
  table.sc input { width: 64px; text-align: center; padding: 5px; }
  table.sc .pct { color: var(--muted); font-size: 13px; }
  .lv-h { color: var(--green); font-weight: 800; } .lv-m { color: var(--amber); font-weight: 800; } .lv-l { color: var(--red); font-weight: 800; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; } .kpi b { font-size: 20px; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .chips button { border: 1px dashed var(--line); background: var(--card); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .paper { background: #fff; color: #000; border-radius: 6px; padding: 28px 30px; box-shadow: var(--shadow); font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.35; overflow-x: auto; }
  .paper h1 { font-size: 16px; text-align: center; margin: 0 0 4px; }
  .paper p { margin: 6px 0; }
  .paper table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .paper td, .paper th { border: 1px solid #000; padding: 3px 5px; vertical-align: top; text-align: center; }
  .paper td.l { text-align: left; }
  .paper img { max-width: 100%; }
  .saved li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .saved ul { list-style: none; padding: 0; margin: 0; }
  .tsec { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .tsec .row .btn.on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .auto { background: var(--violet-soft); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .note { background: var(--green-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  @media print {
    body * { visibility: hidden; }
    #paper, #paper * { visibility: visible; }
    #paper { position: absolute; left: 0; top: 0; box-shadow: none; padding: 0; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="steps no-print" id="steps">
    <button class="btn on" data-s="1" data-i="st1"></button>
    <button class="btn" data-s="2" data-i="st2"></button>
    <button class="btn" data-s="3" data-i="st3"></button>
    <button class="btn" data-s="4" data-i="st4"></button>
    <button class="btn" data-s="5" data-i="st5"></button>
  </div>

  <!-- 1. Негізгі -->
  <section class="card" id="s1">
    <div class="actions"><button class="btn sm" id="newDoc" data-i="newDoc"></button><button class="btn sm" id="sample" data-i="sample"></button><button class="btn sm green" id="saveDoc" data-i="saveDoc"></button></div>
    <h2 data-i="st1"></h2>
    <div class="g4">
      <label class="fld"><span data-i="subject"></span><input type="text" id="subject" list="subjList"><datalist id="subjList"></datalist></label>
      <label class="fld"><span data-i="cls"></span><input type="text" id="cls" placeholder="6А"></label>
      <label class="fld"><span data-i="term"></span><select id="term"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label class="fld"><span data-i="teacher"></span><input type="text" id="teacher"></label>
      <label class="fld"><span data-i="year"></span><input type="text" id="year"></label>
      <label class="fld"><span data-i="docLang"></span><select id="docLang"><option value="kk">Қазақша</option><option value="ru">Русский</option></select></label>
    </div>
    <h3 data-i="works"></h3>
    <p class="muted" style="margin:0 0 8px" data-i="worksHint"></p>
    <div class="works" id="works"></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" data-addw="bzhb" data-i="addBzhb"></button><button class="btn sm" data-addw="tzhb" data-i="addTzhb"></button><button class="btn sm" data-addw="ab" data-i="addAb"></button></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-go="2" data-i="next"></button></div>
  </section>

  <!-- 2. Баллдар -->
  <section class="card hide" id="s2">
    <h2 data-i="st2"></h2>
    <div class="g4">
      <label class="fld" style="grid-column:1/-1"><span data-i="roster"></span><textarea id="roster" rows="5" data-ip="rosterPh"></textarea><small data-i="rosterHint"></small></label>
    </div>
    <label class="row"><input type="checkbox" id="useFo"><span data-i="useFo"></span></label>
    <div class="scroll" id="grid"></div>
    <div class="kpis" id="kpis"></div>
    <div class="tsec" id="tsec"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" data-go="3" data-i="next"></button></div>
  </section>

  <!-- 3. Мақсаттар -->
  <section class="card hide" id="s3">
    <h2 data-i="st3"></h2>
    <div id="goals"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-go="4" data-i="next"></button></div>
  </section>

  <!-- 4. Қорытынды мәтін -->
  <section class="card hide" id="s4">
    <h2 data-i="st4"></h2>
    <div class="auto"><button class="btn primary" id="autoBtn" data-i="autoBtn"></button><span class="muted" data-i="autoHint"></span></div>
    <div id="texts"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-go="5" data-i="next"></button></div>
  </section>

  <!-- 5. Құжат -->
  <section class="hide" id="s5">
    <div class="actions no-print">
      <button class="btn primary" id="word" data-i="word"></button>
      <button class="btn" id="print" data-i="print"></button>
      <label class="row"><input type="checkbox" id="charts"><span data-i="chartsOn"></span></label>
    </div>
    <div class="paper" id="paper"></div>
  </section>

  <section class="card saved no-print" style="margin-top:16px"><h2 data-i="savedT"></h2><ul id="savedList"></ul>
    <p class="note" data-i="privacy"></p></section>
</main>

const SUBJ = { kk: ['Жаратылыстану', 'География', 'Биология', 'Физика', 'Химия', 'Математика', 'Алгебра', 'Геометрия', 'Қазақ тілі', 'Қазақ әдебиеті', 'Орыс тілі', 'Ағылшын тілі', 'Қазақстан тарихы', 'Дүниежүзі тарихы', 'Информатика', 'Дүниетану', 'Әдебиеттік оқу'],

function work(type, n, max) { return { type, n, max, unit: '', ach: '', dif: '', tmax: '', tcrit: '', goals: '' }; }
const tmaxOf = w => (w.tmax || '').split(/[\s,;]+/).map(Number).filter(x => x > 0);
const tcritOf = w => (w.tcrit || '').split('\n').map(x => x.trim());
const blank = () => ({ id: Date.now(), subject: '', cls: '', term: 1, teacher: '', year: '2026-2027', docLang: App.lang,
  works: [work('bzhb', 1, 10), work('bzhb', 2, 10), work('tzhb', 1, 20)], roster: '', scores: {}, fo: {}, useFo: false, goal: '', t2: '', t3: '', t4: '', charts: true });
let A = App.store.get('mt-an-cur') || blank();
let saved = App.store.get('mt-an-saved', []);
const save = () => App.store.set('mt-an-cur', A);
const students = () => A.roster.split('\n').map(s => s.trim()).filter(Boolean);
const wName = (w, lang) => SHORT[lang || App.lang][w.type] + (w.type === 'tzhb' && A.works.filter(x => x.type === 'tzhb').length < 2 ? '' : ' ' + w.n);
const sc = (wi, si) => { const v = (A.scores[wi] || {})[si]; return v === '' || v == null ? null : +v; };
const pct = (wi, si) => { const v = sc(wi, si); return v == null ? null : v / (+A.works[wi].max || 1) * 100; };
const lvOf = p => p >= 85 ? 'h' : p >= 40 ? 'm' : 'l';

function stats(wi) {
  const st = students(); let n = 0, h = 0, m = 0, l = 0, q = 0, u = 0, sum = 0;
  st.forEach((_, si) => { const p = pct(wi, si); if (p == null) return; n++; sum += p; const lv = lvOf(p); lv === 'h' ? h++ : lv === 'm' ? m++ : l++; if (p >= 65) q++; if (p >= 40) u++; });
  return { n, h, m, l, q: n ? Math.round(q / n * 100) : 0, u: n ? Math.round(u / n * 100) : 0, avg: n ? sum / n : 0 };
}
// тоқсандық баға: ҚБ 25% + БЖБ 25% + ТЖБ 50%; ТЖБ жоқ болса, баға шығарылмайды (2–4 сынып — Q = (F+P)/2)
function quarter(si) {
  const fo = +((A.fo || {})[si]); if (!A.useFo || !(A.fo || {})[si]) return null;
  const idx = t => A.works.map((w, i) => w.type === t ? i : -1).filter(i => i >= 0 && sc(i, si) != null);
  const sum = ids => ids.reduce((a, i) => a + sc(i, si), 0), mx = ids => ids.reduce((a, i) => a + +A.works[i].max, 0);
  const ab = idx('ab');
  let p;
  if (ab.length) p = (fo + sum(ab) / mx(ab) * 100) / 2;
  else { const s = idx('bzhb'), c = idx('tzhb'); if (!s.length || !c.length) return null; p = fo * 0.25 + sum(s) / mx(s) * 25 + sum(c) / mx(c) * 50; }
  return p >= 85 ? 5 : p >= 65 ? 4 : p >= 40 ? 3 : 2;
}

function taskPct(wi, k) {

  students().forEach((_, si) => { const v = (ts[si] || {})[k]; if (v !== '' && v != null) { sum += +v; n++; } });
  return n ? sum / (n * m) * 100 : null;

// ---- автоматты талдау: тапсырма ≥ 65% — қол жеткізілген, < 65% — қиындық тудырған
function taskList(wi) {
  const w = A.works[wi], cr = tcritOf(w);
  return tmaxOf(w).map((m, k) => ({ k, crit: cr[k] || '', p: taskPct(wi, k) })).filter(x => x.p != null);
}
function autoWrite() {
  const ru = A.docLang === 'ru', st = students();
  const tl = n => ru ? 'Задание ' + n : n + '-тапсырма';
  const difAll = [], lowNames = new Set();
  A.works.forEach((w, wi) => {
    const tk = taskList(wi);
    if (tk.length) {
      const good = tk.filter(x => x.p >= 65), bad = tk.filter(x => x.p < 65).sort((a, b) => a.p - b.p);
      w.ach = good.map(x => (x.crit || tl(x.k + 1)) + ' (' + Math.round(x.p) + '%)').join('\n');
      w.dif = bad.map(x => (x.crit || tl(x.k + 1)) + ' (' + Math.round(x.p) + '%)').join('\n');
      bad.forEach(x => difAll.push({ w: wName(w, A.docLang), k: x.k + 1, crit: x.crit, p: x.p }));
    } else if (w.goals && !w.ach) w.ach = w.goals;
    st.forEach((s, si) => { const p = pct(wi, si); if (p != null && p < 40) lowNames.add(s); });
  });
  const midLow = new Set();
  A.works.forEach((w, wi) => st.forEach((s, si) => { const p = pct(wi, si); if (p != null && p < 65 && !lowNames.has(s)) midLow.add(s); }));
  if (ru) {
    A.t2 = difAll.length ? difAll.map(d => d.w + ', задание ' + d.k + (d.crit ? ' («' + d.crit + '»)' : '') + ' — выполнение ' + Math.round(d.p) + '%.').join('\n') : 'Все задания выполнены более чем на 65%, существенных затруднений не выявлено. Встречаются отдельные неточности в оформлении ответов.';
    A.t3 = difAll.length ? 'Недостаточное закрепление материала по указанным целям обучения; невнимательное чтение условия задания; затруднения при применении знаний в новой ситуации и при обосновании ответа.' : 'Отдельные неточности связаны с невнимательностью и недостатком времени на проверку работы.';
    A.t4 = [difAll.length ? 'На уроках повторения провести работу над ошибками по целям: ' + [...new Set(difAll.map(d => d.crit || ('задание ' + d.k)))].join('; ') + '.' : 'Продолжить работу по закреплению пройденного материала.',
      lowNames.size ? 'Организовать индивидуальную работу и консультации с обучающимися низкого уровня: ' + [...lowNames].join(', ') + '.' : '',
      midLow.size ? 'Дать дополнительные разноуровневые задания обучающимся: ' + [...midLow].join(', ') + '.' : '',
      'Включать в уроки задания на применение и анализ, учить проверять свою работу.'].filter(Boolean).join('\n');
  } else {
    A.t2 = difAll.length ? difAll.map(d => d.w + ', ' + d.k + '-тапсырма' + (d.crit ? ' («' + d.crit + '»)' : '') + ' — орындалуы ' + Math.round(d.p) + '%.').join('\n') : 'Барлық тапсырма 65%-дан жоғары орындалды, елеулі қиындық байқалмады. Жауапты рәсімдеуде жекелеген қателіктер кездеседі.';
    A.t3 = difAll.length ? 'Аталған оқу мақсаттары бойынша материалдың жеткілікті бекітілмеуі; тапсырманың шартын мұқият оқымау; білімді жаңа жағдаятта қолдануда және жауапты негіздеуде қиналу.' : 'Жекелеген қателіктер ұқыпсыздыққа және жұмысты тексеруге уақыттың жетпеуіне байланысты.';
    A.t4 = [difAll.length ? 'Қайталау сабақтарында келесі мақсаттар бойынша қателікпен жұмыс жүргізу: ' + [...new Set(difAll.map(d => d.crit || (d.k + '-тапсырма')))].join('; ') + '.' : 'Өтілген материалды бекіту жұмысын жалғастыру.',
      lowNames.size ? 'Төмен деңгейдегі білім алушылармен жеке жұмыс және кеңес беру: ' + [...lowNames].join(', ') + '.' : '',
      midLow.size ? 'Келесі білім алушыларға деңгейлік қосымша тапсырмалар беру: ' + [...midLow].join(', ') + '.' : '',
      'Сабақта қолдану және талдау деңгейіндегі тапсырмаларды көбейту, өз жұмысын тексеруге үйрету.'].filter(Boolean).join('\n');
  }
  save();
}
$('autoBtn').onclick = () => {
  const old = JSON.stringify(A);

// ---- ⑤ құжат
function chartSvg() {
  const st = students(); if (!st.length) return '';
  const W = Math.max(640, st.length * (A.works.length * 9 + 10) + 60), H = 300, x0 = 40, y0 = 20, ph = 180;
  const colors = ['#4472c4', '#ed7d31', '#a5a5a5', '#ffc000', '#5b9bd5', '#70ad47'];
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Arial" font-size="10"><rect width="100%" height="100%" fill="#fff"/>';
  [0, 20, 40, 60, 80, 100].forEach(v => { const y = y0 + ph - v / 100 * ph; s += '<line x1="' + x0 + '" x2="' + (W - 10) + '" y1="' + y + '" y2="' + y + '" stroke="#ddd"/><text x="' + (x0 - 4) + '" y="' + (y + 3) + '" text-anchor="end" fill="#555">' + v + '</text>'; });
  const gw = (W - x0 - 20) / st.length, bw = Math.min(14, (gw - 6) / A.works.length);
  st.forEach((name, si) => {
    const gx = x0 + si * gw + (gw - bw * A.works.length) / 2;
    A.works.forEach((w, wi) => { const p = pct(wi, si); if (p == null) return; const h = p / 100 * ph; s += '<rect x="' + (gx + wi * bw) + '" y="' + (y0 + ph - h) + '" width="' + (bw - 1) + '" height="' + h + '" fill="' + colors[wi % colors.length] + '"/>'; });
    const short = name.length > 16 ? name.slice(0, 15) + '…' : name;
    s += '<text transform="translate(' + (x0 + si * gw + gw / 2 + 3) + ',' + (y0 + ph + 6) + ') rotate(60)" fill="#333">' + esc(short) + '</text>';
  });
  let lx = x0;
  A.works.forEach((w, wi) => { s += '<rect x="' + lx + '" y="2" width="10" height="10" fill="' + colors[wi % colors.length] + '"/><text x="' + (lx + 14) + '" y="11" fill="#333">' + esc(wName(w, A.docLang)) + '</text>'; lx += 70; });
  return s + '</svg>';
}
function docHtml(imgSrc) {
  const L = DL[A.docLang], st = students(), wn = w => wName(w, A.docLang);
  const units = A.works.map(w => w.unit).filter(Boolean);
  const goal = A.goal || L.goalAuto(A.subject, [...new Set(units)].join(', '), A.works.map(wn).join(', '));
  let h = '<h1>' + L.title + '</h1><p style="text-align:center"><b>' + ['I', 'II', 'III', 'IV'][A.term - 1] + ' ' + L.term + ' · ' + esc(A.subject) + (L.subjWord ? ' ' + L.subjWord : '') + (A.year ? ' · ' + esc(A.year) : '') + '</b></p>' +
    '<p>' + L.cls + ': <b>' + esc(A.cls) + '</b> &nbsp; ' + L.count + ': <b>' + st.length + '</b> &nbsp; ' + L.teacher + ': <b>' + esc(A.teacher) + '</b></p>' +
    '<p><b>' + L.goalW + ':</b> ' + esc(goal) + '</p>';
  h += '<table><tr><th rowspan="3">' + L.subject + '</th><th rowspan="3">' + L.students + '</th><th rowspan="3">' + L.maxS + '</th><th colspan="3">' + L.pctC + '</th><th rowspan="3">' + L.qual + '</th><th rowspan="3">' + L.perf + '</th></tr>' +
    '<tr><th>' + L.low + '</th><th>' + L.mid + '</th><th>' + L.high + '</th></tr><tr><th>0–39%</th><th>40–84%</th><th>85–100%</th></tr>' +
    A.works.map((w, wi) => { const s = stats(wi); return '<tr><td class="l">' + esc(wn(w)) + '</td><td>' + s.n + '</td><td>' + w.max + '</td><td>' + (s.l || '-') + '</td><td>' + (s.m || '-') + '</td><td>' + (s.h || '-') + '</td><td>' + s.q + '</td><td>' + s.u + '</td></tr>'; }).join('') + '</table>';
  h += '<table><tr><th></th><th>' + L.ach + '</th><th>' + L.dif + '</th></tr>' +
    A.works.map(w => '<tr><td class="l"><b>' + esc(wn(w)) + '</b>' + (w.unit ? '<br>' + esc(w.unit) : '') + '</td><td class="l">' + esc(w.ach).replace(/\n/g, '<br>') + '</td><td class="l">' + esc(w.dif).replace(/\n/g, '<br>') + '</td></tr>').join('') + '</table>';
  A.works.forEach((w, wi) => {
    const tk = taskList(wi); if (!tk.length) return;
    const ru = A.docLang === 'ru';
    h += '<p><b>' + esc(wn(w)) + ': ' + (ru ? 'выполнение заданий' : 'тапсырмалардың орындалуы') + '</b></p><table><tr><th>№</th><th>' + (ru ? 'Критерий оценивания' : 'Бағалау критерийі') + '</th><th>' + (ru ? 'Балл' : 'Балл') + '</th><th>%</th><th>' + (ru ? 'Вывод' : 'Қорытынды') + '</th></tr>' +
      tk.map(x => '<tr><td>' + (x.k + 1) + '</td><td class="l">' + esc(x.crit) + '</td><td>' + tmaxOf(w)[x.k] + '</td><td>' + Math.round(x.p) + '</td><td>' + (x.p >= 65 ? (ru ? 'достигнута' : 'қол жеткізілді') : (ru ? 'затруднение' : 'қиындық')) + '</td></tr>').join('') + '</table>';
  });
  // деңгей бойынша тізім — соңғы ТЖБ (болмаса соңғы жұмыс)
  let li = A.works.map((w, i) => w.type === 'tzhb' ? i : -1).filter(i => i >= 0).pop(); if (li == null) li = A.works.length - 1;
  if (li >= 0) {
    const g = { h: [], m: [], l: [] };
    st.forEach((s, si) => { const p = pct(li, si); if (p != null) g[lvOf(p)].push(s); });
    h += '<p>' + L.lv1(wn(A.works[li])) + '</p><p><b>' + L.H + ': 85–100%</b> ' + (esc(g.h.join(', ')) || L.no) + '</p><p><b>' + L.M + ': 40–84%</b> ' + (esc(g.m.join(', ')) || L.no) + '</p><p><b>' + L.L + ': 0–39%</b> ' + (esc(g.l.join(', ')) || L.no) + '</p>';
  }
  const tl = DL[A.docLang] === DL.ru ? { t2: '2. Затруднения, возникшие у обучающихся при выполнении заданий:', t3: '3. Причины затруднений:', t4: '4. Планируемая коррекционная работа:' } : { t2: '2. Тапсырмаларды орындау барысында білім алушыларға туындаған қиындықтар тізбесі:', t3: '3. Тапсырмаларды орындау барысында білім алушыларға аталған қиындықтардың себептері:', t4: '4. Жоспарланған түзету жұмысы:' };
  ['t2', 't3', 't4'].forEach(k => { h += '<p><b>' + tl[k] + '</b><br>' + esc(A[k]).replace(/\n/g, '<br>') + '</p>'; });
  if (st.length) {
    const q = A.useFo;
    h += '<p style="text-align:center"><b>' + L.mon + '</b></p><p>' + L.monGoal + '</p><table><tr><th rowspan="2">№</th><th rowspan="2">' + L.nameC + '</th>' + A.works.map(w => '<th colspan="2">' + esc(wn(w)) + '</th>').join('') + (q ? '<th rowspan="2">' + A.term + ' ' + L.qC + '</th>' : '') + '</tr>' +
      '<tr>' + A.works.map(w => '<th>' + w.max + '</th><th>%</th>').join('') + '</tr>' +
      st.map((s, si) => '<tr><td>' + (si + 1) + '</td><td class="l">' + esc(s) + '</td>' + A.works.map((w, wi) => { const v = sc(wi, si), p = pct(wi, si); return '<td>' + nz(v) + '</td><td>' + (p == null ? '' : fmtN(p)) + '</td>'; }).join('') + (q ? '<td>' + nz(quarter(si)) + '</td>' : '') + '</tr>').join('') +
      '<tr><td></td><td class="l"><b>' + L.avg + '</b></td>' + A.works.map((w, wi) => { const s = stats(wi); return '<td></td><td><b>' + (s.n ? fmtN(s.avg) : '') + '</b></td>'; }).join('') + (q ? '<td></td>' : '') + '</tr></table>';
    if (A.charts) h += '<p style="text-align:center"><b>' + L.chart + '</b></p>' + (imgSrc ? '<img src="' + imgSrc + '" width="640">' : chartSvg());
  }
  return h;
}
function svgToPng() {
  return new Promise(res => {
    const svg = chartSvg(); if (!svg || !A.charts) return res(null);
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); try { res(c.toDataURL('image/png')); } catch (e) { res(null); } };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
async function exportWord() {
  const png = await svgToPng();
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>' +
    'body{font-family:"Times New Roman";font-size:12pt} h1{font-size:13pt;text-align:center} table{border-collapse:collapse;width:100%} td,th{border:1px solid #000;padding:2pt 4pt;vertical-align:top;text-align:center;font-size:11pt} td.l{text-align:left}' +
    '@page{size:21cm 29.7cm;margin:1.5cm 1.5cm 1.5cm 2cm}</style></head><body>' + docHtml(png) + '</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + html], { type: 'application/msword' }));
  a.download = ((A.docLang === 'ru' ? 'Анализ_' : 'Талдау_') + A.term + 'тқс_' + (A.subject || '') + '_' + (A.cls || '')).replace(/[\\/:*?"<>|\s]+/g, '_') + '.doc';
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
$('word').onclick = exportWord;
$('print').onclick = () => print();
$('charts').onchange = () => { A.charts = $('charts').checked; save(); $('paper').innerHTML = docHtml(); };

  $('savedList').innerHTML = saved.length ? saved.map((s, i) => '<li><span><b>' + esc(s.subject || '—') + '</b> · ' + esc(s.cls) + ' · ' + s.term + ' ' + (App.lang === 'ru' ? 'четв.' : 'тоқсан') + ' <span class="muted">· ' + esc(s.when || '') + '</span></span><span class="row"><button class="btn sm primary" data-op="' + i + '">' + t('open') + '</button><button class="btn sm" data-rm="' + i + '">' + t('del') + '</button></span></li>').join('') : '<li class="muted">' + t('none') + '</li>';
}
$('savedList').onclick = e => {
  const o = e.target.closest('[data-op]'), r = e.target.closest('[data-rm]');
  if (o) { A = JSON.parse(JSON.stringify(saved[+o.dataset.op])); save(); all(); step('1'); }
  else if (r) { const i = +r.dataset.rm, x = saved.splice(i, 1)[0]; App.store.set('mt-an-saved', saved); renderSaved(); App.toast(t('doneDel'), () => { saved.splice(i, 0, x); App.store.set('mt-an-saved', saved); renderSaved(); }); }
};
$('saveDoc').onclick = () => {
  const c = JSON.parse(JSON.stringify(A)); c.when = new Date().toLocaleDateString();
  const i = saved.findIndex(s => s.id === A.id); if (i >= 0) saved[i] = c; else saved.unshift(c);
  App.store.set('mt-an-saved', saved); renderSaved();
  $('saveDoc').textContent = t('saved'); setTimeout(() => $('saveDoc').textContent = t('saveDoc'), 1500);
};
function replaceA(next, msg) { const old = JSON.stringify(A); A = next; save(); all(); App.toast(msg, () => { A = JSON.parse(old); save(); all(); }); }
$('newDoc').onclick = () => replaceA(blank(), t('doneNew'));
$('sample').onclick = () => {
  const old = JSON.stringify(A);
  const ru = App.lang === 'ru';
  A = Object.assign(blank(), { subject: ru ? 'Естествознание' : 'Жаратылыстану', cls: '5А', teacher: ru ? 'Иванова А.' : 'Сейтқали А.', docLang: App.lang,
    works: [Object.assign(work('bzhb', 1, 8), { unit: ru ? '«Мир науки»' : '«Ғылым әлемі»', ach: '5.1.1.1\n5.1.2.1', dif: '5.1.5.1' }), Object.assign(work('bzhb', 2, 10), { unit: ru ? '«Вселенная. Земля. Человек»' : '«Ғалам. Жер. Адам»', ach: '5.2.1.1\n5.2.2.2', dif: '5.2.5.3' }), work('tzhb', 1, 20)],
    roster: (ru ? 'Ученик 1\nУченик 2\nУченик 3\nУченик 4\nУченик 5\nУченик 6' : 'Оқушы 1\nОқушы 2\nОқушы 3\nОқушы 4\nОқушы 5\nОқушы 6'),
    scores: { 0: { 0: 6, 1: 7, 2: 8, 3: 5, 4: 3, 5: 7 }, 1: { 0: 8, 1: 8, 2: 10, 3: 6, 4: 5, 5: 9 }, 2: { 0: 18, 1: 18, 2: 19, 3: 12, 4: 9, 5: 17 } } });
  // БЖБ 2 тапсырмалар бойынша (сіздің БЖБ-2 үлгісі: 2+2+1+2+2+1 = 10)
  A.works[1].tmax = '2 2 1 2 2 1';
  A.works[1].tcrit = ru ? 'Знает мега-, макро- и микромир\nЗнает оболочки Земли\nЗнает движение Земли вокруг оси\nОпределяет гипотезы происхождения жизни\nЗнает координаты и масштаб\nЗнает условные знаки'
    : 'Мегаәлем, макроәлем, микроәлем туралы біледі\nЖер қабаттарын біледі\nЖердің өз өсі арқылы қозғалуын біледі\nТіршіліктің пайда болуы туралы гипотезаларды анықтайды\nГеографиялық координаталарды және масштабты біледі\nШартты белгілерді біледі';
  A.tscores = { 1: { 0: { 0: 2, 1: 2, 2: 1, 3: 2, 4: 0, 5: 1 }, 1: { 0: 2, 1: 2, 2: 1, 3: 2, 4: 1, 5: 0 }, 2: { 0: 2, 1: 2, 2: 1, 3: 2, 4: 2, 5: 1 }, 3: { 0: 2, 1: 1, 2: 1, 3: 1, 4: 1, 5: 0 }, 4: { 0: 1, 1: 1, 2: 1, 3: 1, 4: 1, 5: 0 }, 5: { 0: 2, 1: 2, 2: 1, 3: 2, 4: 1, 5: 1 } } };
  autoWrite();
  save(); all();
  App.toast(t('doneSample'), () => { A = JSON.parse(old); save(); all(); });
};

function step(s) {
  document.querySelectorAll('#steps .btn').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  ['1', '2', '3', '4', '5'].forEach(k => $('s' + k).classList.toggle('hide', k !== s));
  if (s === '2') renderGrid(); if (s === '3') renderGoals(); if (s === '4') renderTexts();
  if (s === '5') { $('charts').checked = A.charts; $('paper').innerHTML = docHtml(); }
  scrollTo({ top: 0, behavior: 'smooth' });
}
$('steps').onclick = e => { const b = e.target.closest('[data-s]'); if (b) step(b.dataset.s); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => step(b.dataset.go));
function all() { renderS1(); $('roster').value = A.roster; $('useFo').checked = A.useFo; renderGrid(); renderGoals(); renderTexts(); renderSaved(); }
App.onLang.push(l => { A.docLang = l; save(); all(); });
// генератордан келген жұмыс
(function importFromGen() {
  const im = App.store.get('mt-an-import'); if (!im || location.hash !== '#import') return;
  App.store.set('mt-an-import', null); history.replaceState(null, '', location.pathname + location.search);

  const empty = !students().length && !A.works.some(x => x.ach || x.unit || x.tmax);
  const same = A.subject === im.subject && String(A.cls) === String(im.cls) && +A.term === +im.term;
  if (!empty && !same) { const c = JSON.parse(JSON.stringify(A)); c.when = new Date().toLocaleDateString(); const i = saved.findIndex(s => s.id === A.id); if (i >= 0) saved[i] = c; else saved.unshift(c); App.store.set('mt-an-saved', saved); }
  if (empty || !same) { A = blank(); A.works = []; }
  if (!A.works.length) Object.assign(A, { subject: im.subject, cls: im.cls, term: im.term, docLang: im.docLang || A.docLang });
  A.works.push(w); renum(); save();
})();
all();
if (A.works.some(w => w.tmax) && !students().length) step('2');
